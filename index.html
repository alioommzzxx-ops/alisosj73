<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f6fa">
<title>مصنع AI — أنشئ تطبيقك بوصف عربي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6fa; --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8; --line:#e2e8f0;
  --sky:#0284c7; --sky-d:#0369a1; --sky-l:#38bdf8; --sky-soft:#e0f2fe; --white:#fff;
  --glass:rgba(255,255,255,.74); --danger:#dc2626; --danger-soft:#fee2e2; --ok:#15803d; --ok-soft:#dcfce7; --warn-soft:#fef3c7;
  --r-card:22px; --r-ctl:14px; --r-sm:10px;
  --font:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:var(--font);color:var(--ink);line-height:1.7;min-height:100vh;
  background:
    radial-gradient(900px 500px at 85% -10%,rgba(56,189,248,.22),transparent 60%),
    radial-gradient(700px 480px at 0% 30%,rgba(148,163,184,.18),transparent 60%),
    var(--bg);
  background-attachment:fixed;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky-l);outline-offset:2px}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:rgba(243,246,250,.8);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-in{max-width:1200px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;text-decoration:none;color:var(--ink);white-space:nowrap}
.logo-mark{width:36px;height:36px;border-radius:11px;background:var(--sky);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700}
.nav{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.nav a,.nav button{white-space:nowrap;border:0;background:transparent;padding:8px 12px;border-radius:var(--r-sm);text-decoration:none;color:var(--ink2);font-weight:500;font-size:15px;transition:background .15s,color .15s}
.nav a:hover,.nav button:hover{background:var(--sky-soft);color:var(--sky-d)}
.nav a.on{background:var(--sky-soft);color:var(--sky-d)}

main{max-width:1200px;margin:auto;padding:20px 16px 40px}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 10px 30px -12px rgba(2,132,199,.18);border-radius:var(--r-card)}

/* buttons */
.btn{text-decoration:none;color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--white);padding:10px 16px;border-radius:var(--r-ctl);font-weight:600;font-size:15px;transition:transform .12s,background .15s,border-color .15s}
.btn:hover{border-color:var(--sky-l);background:#f8fcff}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--sky);border-color:var(--sky);color:#fff}
.btn.go{white-space:normal}
.btn.primary:hover{background:var(--sky-d)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}

/* home */
.hero{max-width:780px;margin:18px auto 0}
.hero h1{font-size:clamp(28px,6vw,44px);line-height:1.35;margin:0 0 10px;font-weight:700;letter-spacing:-.2px}
.hero p.sub{margin:0 0 22px;color:var(--ink2);font-size:17px;max-width:60ch}
.idea{padding:14px;animation:rise .45s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.idea textarea{width:100%;min-height:170px;resize:vertical;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.9);padding:16px;font-size:17px;line-height:1.8;transition:border-color .15s,box-shadow .15s}
.idea textarea:focus{outline:none;border-color:var(--sky-l);box-shadow:0 0 0 4px rgba(56,189,248,.2)}
.idea-foot{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.count{color:var(--ink3);font-size:13px;margin-inline-start:auto;direction:ltr;unicode-bidi:isolate}
.go{width:100%;padding:15px 18px;font-size:clamp(15px,4.4vw,18px);margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.85);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--ink2);transition:background .15s,border-color .15s,color .15s}
.chip:hover{background:var(--sky-soft);border-color:var(--sky-l);color:var(--sky-d)}
.notice{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--warn-soft);color:#78350f;font-size:15px}
.notice.err{background:var(--danger-soft);color:#7f1d1d}
.notice.ok{background:var(--ok-soft);color:#14532d}

/* progress */
.progress{padding:16px;margin-top:14px}
.p-top{display:flex;align-items:center;gap:10px}
.p-stage{font-weight:600;flex:1}
.p-bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 8px}
.p-bar i{display:block;height:100%;width:35%;border-radius:99px;background:var(--sky-l);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{margin-inline-start:-35%}100%{margin-inline-start:100%}}
.p-meta{color:var(--ink3);font-size:13px}
.p-files{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.p-files li{background:var(--sky-soft);color:var(--sky-d);border-radius:8px;padding:2px 10px;font-size:13px;font-family:var(--mono);direction:ltr}

/* projects */
.page-title{font-size:26px;margin:6px 0 16px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pcard{padding:16px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,box-shadow .15s}
.pcard:hover{transform:translateY(-2px)}
.pcard h3{margin:0;font-size:18px;line-height:1.4}
.pcard small{color:var(--ink3)}
.pcard .row{display:flex;gap:8px;margin-top:10px}
.empty{padding:36px 18px;text-align:center;color:var(--ink2)}

/* workspace */
.wbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.wname{font-size:20px;font-weight:700;margin:0;flex:1;min-width:140px;border:0;background:transparent;text-align:start;padding:4px 6px;border-radius:8px}
.wname:hover{background:rgba(255,255,255,.7)}
.tabs{display:flex;gap:6px;margin-bottom:12px;padding:5px}
.tab{flex:1;border:0;background:transparent;padding:9px 8px;border-radius:12px;font-weight:600;color:var(--ink2);transition:background .15s,color .15s}
.tab.on{background:var(--white);color:var(--sky-d);box-shadow:0 2px 8px -2px rgba(2,132,199,.25)}
.work{display:grid;gap:14px}
.panel{display:none}
.work[data-tab=preview] #p-preview,.work[data-tab=files] #p-files,.work[data-tab=chat] #p-chat{display:block}
@media(min-width:960px){
  .work{grid-template-columns:380px 1fr;align-items:start}
  .tab[data-t=chat]{display:none}
  #p-chat{display:block!important;grid-column:1;grid-row:1}
  #p-preview,#p-files{grid-column:2;grid-row:1}
  .work[data-tab=chat] #p-preview{display:block}
}
.pv-tool{display:flex;gap:8px;align-items:center;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pv-tool select{flex:1;min-width:120px}
select,.inp{border:1px solid var(--line);background:#fff;border-radius:var(--r-sm);padding:8px 10px}
.frame-wrap{background:#fff;border-radius:0 0 var(--r-card) var(--r-card);overflow:hidden}
.frame-wrap iframe{display:block;width:100%;height:68vh;min-height:420px;border:0;background:#fff}
.pv-note{padding:8px 12px;font-size:13px;color:var(--ink3);border-top:1px solid var(--line)}
.pv-err{padding:10px 12px;background:var(--danger-soft);color:#7f1d1d;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pv-err span{flex:1;direction:ltr;text-align:left;font-family:var(--mono);font-size:12px;word-break:break-word}
.ed{width:100%;min-height:58vh;border:0;border-top:1px solid var(--line);padding:14px;font-family:var(--mono);font-size:13.5px;line-height:1.65;direction:ltr;text-align:left;background:#fbfdff;resize:vertical;border-radius:0 0 var(--r-card) var(--r-card);tab-size:2;white-space:pre}
.ed:focus{outline:none;box-shadow:inset 0 0 0 3px rgba(56,189,248,.25)}
.dirty{color:#b45309;font-size:13px;font-weight:600}

/* chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 230px);min-height:420px;max-height:760px}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:92%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-break:break-word;font-size:15px}
.bub.u{align-self:flex-start;background:var(--sky);color:#fff;border-end-start-radius:6px}
.bub.a{align-self:flex-end;background:#fff;border:1px solid var(--line);border-end-end-radius:6px}
.bub.e{align-self:stretch;max-width:100%;background:var(--danger-soft);color:#7f1d1d}
.bub.p{align-self:stretch;max-width:100%;background:transparent;padding:0}
.bub .progress{margin-top:0}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 8px}
.cin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:flex-end}
.cin textarea{flex:1;min-height:46px;max-height:140px;resize:none;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.cin textarea:focus{outline:none;border-color:var(--sky-l);box-shadow:0 0 0 3px rgba(56,189,248,.2)}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.35);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:16px}
.modal-box{background:#fff;border-radius:var(--r-card);padding:20px;max-width:460px;width:100%;box-shadow:0 30px 60px -20px rgba(15,23,42,.4)}
.modal-box h3{margin:0 0 8px}
.modal-box .inp{width:100%;margin:10px 0}
.toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));inset-inline:16px;display:flex;flex-direction:column;gap:8px;align-items:center;z-index:60;pointer-events:none}
.toast{pointer-events:auto;background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:15px;max-width:520px;animation:rise .2s ease-out both}
.toast.err{background:#b91c1c}.toast.ok{background:#15803d}
.models{direction:ltr;text-align:left;font-family:var(--mono);font-size:12px;max-height:160px;overflow:auto;background:var(--bg);border-radius:10px;padding:8px;margin-top:8px}
footer{text-align:center;color:var(--ink3);font-size:13px;padding:10px 16px 24px}
@media(max-width:420px){.top-in{gap:4px;padding:8px 12px}.logo{font-size:17px;gap:8px}.logo-mark{width:32px;height:32px;font-size:18px}.nav{gap:0}.nav a,.nav button{padding:7px 8px;font-size:14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="logo" href="#/"><span class="logo-mark">م</span><span>مصنع AI</span></a>
  <nav class="nav">
    <a href="#/" id="nav-home">جديد</a>
    <a href="#/projects" id="nav-projects">مشاريعي</a>
    <button type="button" id="btn-health">اختبار الاتصال</button>
  </nav>
</div></header>

<main>
  <section id="view-home">
    <div class="hero">
      <h1>اكتب فكرتك بالعربية،<br>ويبني Claude مشروعك الحقيقي</h1>
      <p class="sub">صِف ما تريد: نظام، متجر، لعبة، موقع. ستحصل على ملفات فعلية تعاينها وتعدّلها وتصدّرها.</p>
      <div id="key-warn" class="notice hidden"></div>
      <div class="idea glass">
        <textarea id="idea" placeholder="مثال: أنشئ نظاماً لإدارة طلاب مدرسة وتسجيل الغيابات، مع تقرير شهري لكل طالب…" maxlength="4000"></textarea>
        <div class="chips" id="chips"></div>
        <div class="idea-foot"><span class="count" id="count">0 / 4000</span></div>
        <button type="button" class="btn primary go" id="go">أنشئ مشروعي بالذكاء الاصطناعي</button>
      </div>
      <div id="home-progress"></div>
    </div>
  </section>

  <section id="view-projects" class="hidden">
    <h2 class="page-title">مشاريعي السابقة</h2>
    <div id="plist" class="grid"></div>
  </section>

  <section id="view-work" class="hidden"></section>
</main>
<footer>مصنع AI — تطوير المهندس علي المعموري</footer>
<div class="toasts" id="toasts"></div>
<div id="modal-root"></div>

<script>
'use strict';
/* ═════════ أدوات ═════════ */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
function toast(msg, type) {
  const t = h('div', { class: 'toast ' + (type || '') }, msg);
  $('#toasts').append(t);
  setTimeout(() => t.remove(), type === 'err' ? 6000 : 3200);
}
function fmtDate(ts) {
  try { return new Date(ts).toLocaleString('ar-IQ', { dateStyle: 'medium', timeStyle: 'short' }); } catch { return ''; }
}
let ACCESS = '';
try { ACCESS = localStorage.getItem('masna_code') || ''; } catch { /* ignore */ }

const state = { config: null, project: null, tab: 'preview', page: 'index.html', activeFile: null, dirty: false, busy: false, previewErr: null };

/* ═════════ نوافذ ═════════ */
function modal(content) {
  const box = h('div', { class: 'modal-box' }, content);
  const m = h('div', { class: 'modal' }, box);
  $('#modal-root').append(m);
  return { el: m, close: () => m.remove() };
}
function askCode(wrong) {
  return new Promise(resolve => {
    const inp = h('input', { class: 'inp', type: 'password', placeholder: 'رمز الدخول', autocomplete: 'off' });
    const m = modal([
      h('h3', null, 'رمز الدخول مطلوب'),
      h('div', { class: 'p-meta' }, wrong ? 'الرمز غير صحيح، حاول مرة أخرى.' : 'أدخل الرمز الذي ضبطه صاحب المنصة.'),
      inp,
      h('button', { class: 'btn primary', type: 'button', onclick: () => {
        ACCESS = inp.value.trim();
        try { localStorage.setItem('masna_code', ACCESS); } catch { /* ignore */ }
        m.close(); resolve();
      } }, 'دخول'),
    ]);
    setTimeout(() => inp.focus(), 50);
  });
}

/* ═════════ الاتصال بالخادم ═════════ */
async function api(url, opt = {}) {
  const headers = { 'x-access-code': ACCESS };
  if (opt.body) headers['Content-Type'] = 'application/json';
  let r;
  try { r = await fetch(url, { method: opt.method || 'GET', headers, body: opt.body ? JSON.stringify(opt.body) : undefined }); }
  catch { throw new Error('تعذّر الاتصال بالخادم. تحقق من الإنترنت.'); }
  let data = null;
  try { data = await r.json(); } catch { /* ignore */ }
  if (r.status === 401) { await askCode(!!ACCESS); return api(url, opt); }
  if (!r.ok) throw new Error((data && data.error) || 'حدث خطأ غير متوقع.');
  return data;
}

async function streamGenerate(prompt, projectId, onEvent, signal) {
  let r;
  try {
    r = await fetch('/api/generate', {
      method: 'POST', signal,
      headers: { 'Content-Type': 'application/json', 'x-access-code': ACCESS },
      body: JSON.stringify({ prompt, projectId: projectId || null }),
    });
  } catch (e) { if (e.name === 'AbortError') throw e; throw new Error('تعذّر الاتصال بالخادم. تحقق من الإنترنت.'); }
  if (r.status === 401) { await askCode(!!ACCESS); return streamGenerate(prompt, projectId, onEvent, signal); }
  if (!r.ok || !(r.headers.get('content-type') || '').includes('text/event-stream')) {
    let d = null; try { d = await r.json(); } catch { /* ignore */ }
    throw new Error((d && d.error) || 'تعذّر بدء الإنشاء.');
  }
  const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) !== -1) {
      const block = buf.slice(0, i); buf = buf.slice(i + 2);
      const line = block.split('\n').find(l => l.startsWith('data:'));
      if (!line) continue;
      let ev; try { ev = JSON.parse(line.slice(5)); } catch { continue; }
      onEvent(ev);
    }
  }
}

/* ═════════ شريط التقدم ═════════ */
function progressView() {
  const stage = h('div', { class: 'p-stage' }, 'جاري تحليل فكرتك…');
  const meta = h('div', { class: 'p-meta' }, '0 ثانية');
  const list = h('ul', { class: 'p-files' });
  let cancelFn = () => {};
  const cancel = h('button', { class: 'btn ghost sm', type: 'button', onclick: () => cancelFn() }, 'إلغاء');
  const el = h('div', { class: 'progress glass' },
    h('div', { class: 'p-top' }, stage, cancel),
    h('div', { class: 'p-bar' }, h('i')), meta, list);
  const t0 = Date.now(); let chars = 0;
  const tick = setInterval(() => {
    meta.textContent = Math.round((Date.now() - t0) / 1000) + ' ثانية' + (chars ? ` • ${chars.toLocaleString('ar')} حرف` : '');
  }, 500);
  return {
    el,
    onCancel(f) { cancelFn = f; },
    file(p) { stage.textContent = 'جاري كتابة ملفات المشروع…'; list.append(h('li', null, p)); },
    chars(n) { chars = n; },
    saving() { stage.textContent = 'جاري الحفظ…'; },
    stop() { clearInterval(tick); },
  };
}

async function runJob(prompt, projectId, pv) {
  const ctrl = new AbortController();
  pv.onCancel(() => ctrl.abort());
  let result = null, error = null;
  try {
    await streamGenerate(prompt, projectId, ev => {
      if (ev.type === 'file') pv.file(ev.path);
      else if (ev.type === 'progress') pv.chars(ev.chars);
      else if (ev.type === 'done') { pv.saving(); result = ev; }
      else if (ev.type === 'message') result = ev;
      else if (ev.type === 'error') error = ev.message;
    }, ctrl.signal);
  } catch (e) { error = e.name === 'AbortError' ? 'تم إلغاء العملية.' : e.message; }
  pv.stop();
  if (!result && !error) error = 'انقطع الاتصال بالخادم قبل اكتمال الإنشاء. أعد المحاولة.';
  return { result, error };
}

/* ═════════ التنقل ═════════ */
function showView(name) {
  for (const v of ['home', 'projects', 'work']) $('#view-' + v).classList.toggle('hidden', v !== name);
  $('#nav-home').classList.toggle('on', name === 'home');
  $('#nav-projects').classList.toggle('on', name === 'projects');
  window.scrollTo(0, 0);
}
function route() {
  const hash = location.hash || '#/';
  if (hash.startsWith('#/p/')) openProject(hash.slice(4));
  else if (hash === '#/projects') renderProjects();
  else showView('home');
}
window.addEventListener('hashchange', route);
window.addEventListener('beforeunload', e => { if (state.busy || state.dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ═════════ الصفحة الرئيسية ═════════ */
const EXAMPLES = [
  ['نظام طلاب وغيابات', 'أنشئ نظام إدارة طلاب وغيابات لمدرسة: إضافة طلاب وصفوف، تسجيل الحضور والغياب اليومي، وتقرير شهري لكل طالب مع إمكانية الطباعة.'],
  ['متجر إلكتروني', 'أنشئ متجراً إلكترونياً لبيع الملابس بالدينار العراقي: قائمة منتجات مع تصنيفات وبحث، سلة مشتريات، وإتمام الطلب بنموذج بيانات الزبون.'],

const PREVIEW_SHIM = `<script>(function(){
function mk(){var d={};return{getItem:function(k){return Object.prototype.hasOwnProperty.call(d,k)?d[k]:null},setItem:function(k,v){d[k]=String(v)},removeItem:function(k){delete d[k]},clear:function(){d={}},key:function(i){return Object.keys(d)[i]||null},get length(){return Object.keys(d).length}}}
['localStorage','sessionStorage'].forEach(function(n){try{Object.defineProperty(window,n,{value:mk(),configurable:true})}catch(e){}});
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(!a)return;var h=a.getAttribute('href');
if(/^[^:#?]+\\.html([#?].*)?$/.test(h)){e.preventDefault();parent.postMessage({masna:'nav',href:h},'*')}
else if(/^https?:/i.test(h)){a.target='_blank';a.rel='noopener noreferrer'}},true);
window.addEventListener('error',function(e){parent.postMessage({masna:'err',msg:String(e.message||'')+(e.lineno?' (سطر '+e.lineno+')':'')},'*')});
window.addEventListener('unhandledrejection',function(e){parent.postMessage({masna:'err',msg:String(e.reason&&e.reason.message||e.reason||'')},'*')});
})();<\/script>`;

function resolvePath(href, fromPage) {
  try { return decodeURIComponent(new URL(href.split('#')[0].split('?')[0], 'http://p.local/' + fromPage).pathname.slice(1)); } catch { return null; }
}

function buildPreview(files, page) {
  let html = files[page];
  if (html == null) return '<!doctype html><meta charset="utf-8"><body dir="rtl" style="font-family:sans-serif;padding:24px;color:#475569">لا يوجد ملف HTML للمعاينة.</body>';
  const local = href => (/^([a-z]+:)?\/\//i.test(href) || /^(data|blob|mailto|tel):/i.test(href)) ? null : resolvePath(href, page);
  html = html.replace(/<link\b[^>]*>/gi, tag => {
    if (!/rel\s*=\s*["']?stylesheet/i.test(tag)) return tag;
    const m = tag.match(/href\s*=\s*["']([^"']+)["']/i); if (!m) return tag;
    const p = local(m[1]);
    return p && files[p] !== undefined ? '<style>' + files[p].replace(/<\/style/gi, '<\\/style') + '</style>' : tag;
  });
  html = html.replace(/<script\b([^>]*?)\bsrc\s*=\s*["']([^"']+)["']([^>]*)>\s*<\/script>/gi, (all, a, src, b) => {
    const p = local(src);
    return p && files[p] !== undefined ? `<script${a}${b}>` + files[p].replace(/<\/script/gi, '<\\/script') + '<\/script>' : all;
  });
  html = html.replace(/(<img\b[^>]*?\bsrc\s*=\s*)(["'])([^"']+\.svg)\2/gi, (all, pre, q, src) => {
    const p = local(src);
    return p && files[p] !== undefined ? `${pre}"data:image/svg+xml;charset=utf-8,${encodeURIComponent(files[p])}"` : all;
  });
  if (/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i, m => m + PREVIEW_SHIM);
  if (/<html[^>]*>/i.test(html)) return html.replace(/<html[^>]*>/i, m => m + '<head>' + PREVIEW_SHIM + '</head>');
  return PREVIEW_SHIM + html;
}

  try {
    await api(`/api/projects/${state.project.id}/files`, { method: 'PUT', body: { path, content } });
    state.project.files[path] = content; state.dirty = false; state.activeFile = path;
    refreshEditor(); refreshPreview(); toast('تم الحفظ', 'ok');
  } catch (e) { toast(e.message, 'err'); }

async function newFile() {

  if (!name) return;

async function deleteFile() {
  const f = state.activeFile;
  if (!f) return;
  if (f === 'index.html') { toast('لا يمكن حذف index.html', 'err'); return; }
  if (!confirm(`حذف الملف ${f}؟`)) return;
  try {

async function sendChat(text) {

  text = String(text).trim();
  if (text.length < 4) { toast('اكتب طلباً أوضح.', 'err'); return; }

}

/* ═════════ تصدير ZIP (بدون مكتبات) ═════════ */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(bytes) { let c = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files) {

  let offset = 0, count = 0;
  const d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const [name, content] of Object.entries(files)) {
    const nb = enc.encode(name), data = enc.encode(content), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, nb.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), nb, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, nb.length, true);
    ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), nb);
    offset += 30 + nb.length + data.length; count++;
  }
  const cdSize = central.reduce((n, a) => n + a.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, count, true); end.setUint16(10, count, true); end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}
function exportZip() {
  const files = state.project.files;
  if (!Object.keys(files).length) { toast('لا توجد ملفات للتصدير.', 'err'); return; }
  const blob = makeZip(files);
  const a = h('a', { href: URL.createObjectURL(blob), download: 'masna-project.zip' });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('بدأ تنزيل ملف ZIP', 'ok');
}

/* ═════════ اختبار الاتصال ═════════ */
$('#btn-health').addEventListener('click', async () => {
  const body = h('div', { class: 'p-meta' }, 'جاري الاختبار الفعلي مع Anthropic…');
  const m = modal([h('h3', null, 'اختبار الاتصال بـ Claude'), body, h('button', { class: 'btn', type: 'button', onclick: () => m.close() }, 'إغلاق')]);
  try {
    const r = await api('/api/health/anthropic');
    body.className = 'notice ' + (r.ok && r.modelOk ? 'ok' : r.ok ? '' : 'err');
    body.replaceChildren(r.message);
    if (r.models && r.models.length) body.append(h('div', { class: 'models' }, r.models.join('\n')));
  } catch (e) { body.className = 'notice err'; body.replaceChildren(e.message); }
});

/* ═════════ البدء ═════════ */
(async function init() {
  initHome();
  try {
    const r = await fetch('/api/config'); state.config = await r.json();
    $('#idea').maxLength = state.config.maxPromptChars || 4000;
    if (state.config.needsCode && !ACCESS) await askCode(false);
    if (!state.config.hasKey) {
      const w = $('#key-warn'); w.classList.remove('hidden');
      w.textContent = 'مفتاح Anthropic غير مضبوط على الخادم بعد. أضف ANTHROPIC_API_KEY في إعدادات الاستضافة ثم أعد التشغيل، وبعدها اضغط «اختبار الاتصال».';
    }
  } catch { toast('تعذّر قراءة إعدادات الخادم.', 'err'); }
  route();
})();
</script>
