<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1456c8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='22' fill='%231456c8'/%3E%3Cg fill='%23fff'%3E%3Crect x='20' y='20' width='22' height='22' rx='4'/%3E%3Crect x='54' y='20' width='22' height='22' rx='4'/%3E%3Crect x='20' y='54' width='22' height='22' rx='4'/%3E%3Crect x='54' y='54' width='9' height='9'/%3E%3Crect x='67' y='67' width='9' height='9'/%3E%3Crect x='67' y='54' width='9' height='9'/%3E%3C/g%3E%3Cg fill='%231456c8'%3E%3Crect x='26' y='26' width='10' height='10'/%3E%3Crect x='60' y='26' width='10' height='10'/%3E%3Crect x='26' y='60' width='10' height='10'/%3E%3C/g%3E%3C/svg%3E">
<title>نظام الحضور والغيابات — إعدادية النهرين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --blue:#1456c8; --blue-d:#0b2f73; --blue-m:#3b7be8; --sky:#eaf2ff; --sky-2:#f5f9ff; --line:#d6e3f8;
  --ink:#10244d; --muted:#5f7194; --white:#fff;
  --ok:#0f8a4f; --ok-bg:#e3f6ec; --warn:#a86400; --warn-bg:#fff2d6; --bad:#c62828; --bad-bg:#fde8e8; --info:#1456c8; --info-bg:#e4eeff; --mute-bg:#eef2f8;
  --r:14px; --sh:0 1px 2px rgba(11,47,115,.06),0 6px 20px rgba(11,47,115,.07);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;color:var(--ink);background:var(--sky-2);font-size:16px;line-height:1.55}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.3}
h2{font-size:1.35rem;color:var(--blue-d)}
h3{font-size:1.05rem;color:var(--blue-d)}
a{color:var(--blue)}
.muted{color:var(--muted)} .center{text-align:center} .hidden{display:none!important}
small{color:var(--muted)}
code,.code{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;unicode-bidi:embed}

/* inputs */
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--white);outline:none;min-height:44px}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(20,86,200,.15)}
input[type=checkbox],input[type=radio]{width:20px;height:20px;min-height:0;accent-color:var(--blue);padding:0}
label{display:block;font-weight:600;font-size:.92rem;margin-bottom:12px}
label>input,label>select,label>textarea{margin-top:6px;font-weight:400}
label.inl{display:flex;align-items:center;gap:8px;font-weight:600}
label.inl>input{margin:0;width:20px}
input[type=date],input[type=time]{direction:ltr;text-align:right}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--white);color:var(--blue-d);padding:9px 16px;border-radius:10px;font-weight:700;cursor:pointer;min-height:44px;transition:background .15s,border-color .15s;text-decoration:none}
.btn:hover{background:var(--sky)}
.btn:focus-visible{outline:3px solid rgba(20,86,200,.4);outline-offset:2px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger:hover{background:#9f1d1d}
.btn.sm{min-height:36px;padding:5px 12px;font-size:.88rem}
.btn.block{width:100%}
.btn.link{border:none;background:none;text-decoration:underline;min-height:36px}
.btn.danger-t{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* layout */
.row{display:flex;align-items:center}
.row.gap,.gap{gap:10px}
.row.wrap,.wrap{flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--blue);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{display:block;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:#cfe0ff;font-size:.78rem}
.mark{width:38px;height:38px;flex:none;display:grid;place-items:center;background:#fff;border-radius:10px}
.mark svg{width:26px;height:26px}
.top-r{display:flex;align-items:center;gap:8px;flex:none}
.top .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff}
.top .btn:hover{background:rgba(255,255,255,.26)}
.who{font-size:.85rem;color:#dbe8ff;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync{width:10px;height:10px;border-radius:50%;background:#5ee19a;flex:none}
.sync.off{background:#ffb4b4}

.tabs{position:sticky;top:58px;z-index:19;display:flex;gap:4px;overflow-x:auto;background:var(--white);border-bottom:1px solid var(--line);padding:6px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;text-decoration:none;color:var(--muted);font-weight:700;padding:8px 14px;border-radius:999px;white-space:nowrap}
.tabs a.on{background:var(--blue);color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px 14px 90px}
.page-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.page-h .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.page-h input[type=date]{width:auto}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--white);border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:right;cursor:pointer;font-family:inherit}
.stat b{display:block;font-size:1.7rem;line-height:1.1;color:var(--blue-d)}
.stat span{font-size:.85rem;color:var(--muted);font-weight:600}
.stat.on{border-color:var(--blue);background:var(--sky)}
.stat.ok b{color:var(--ok)} .stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)}
@media(min-width:760px){.stats{grid-template-columns:repeat(6,1fr)}}

.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.filters input[type=search]{grid-column:1/-1}
@media(min-width:760px){.filters{grid-template-columns:2fr 1fr 1fr 1fr 1fr}.filters input[type=search]{grid-column:auto}}

/* list rows */
.list{padding:4px 12px}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item b{display:block;font-size:1rem}
.item small{display:block}
.item .side{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.item .st-sel{width:auto;min-height:38px;padding:4px 8px;font-size:.9rem}
.av{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none;background:var(--sky);border:1px solid var(--line)}
.av.ph{display:grid;place-items:center;font-weight:800;color:var(--blue);font-size:1.2rem}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.badge{display:inline-block;padding:3px 11px;border-radius:999px;font-weight:700;font-size:.82rem;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)} .badge.info{background:var(--info-bg);color:var(--info)} .badge.mute{background:var(--mute-bg);color:var(--muted)}
.tm{font-size:.82rem;color:var(--muted);direction:ltr}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(11,31,77,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{position:relative;background:var(--white);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom))}
.modal.wide{max-width:900px}
.modal .x{position:absolute;left:12px;top:10px;width:36px;height:36px;border:none;background:var(--sky);border-radius:50%;font-size:1.4rem;cursor:pointer;color:var(--blue-d)}
.modal h3{margin-bottom:14px;padding-left:40px}
@media(min-width:640px){.modal-bg{align-items:center;padding:20px}.modal{border-radius:18px}}
.confirm-msg{font-size:1.05rem;margin:6px 0 18px}
.form-grid{display:grid;grid-template-columns:1fr;gap:0 12px}
@media(min-width:560px){.form-grid{grid-template-columns:1fr 1fr}.form-grid .full{grid-column:1/-1}}
.photo-pick{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.photo-pick img,.photo-pick .av{width:78px;height:104px;border-radius:12px;object-fit:cover}

/* qr */
.qr-box{display:flex;justify-content:center;margin:6px 0 10px}
.qr-canvas{width:min(280px,70vw);height:auto;border:1px solid var(--line);border-radius:12px}
.code{display:block;text-align:center;color:var(--muted);margin-bottom:12px;font-size:.9rem}

/* scanner */
.scan-wrap{display:grid;gap:14px;max-width:560px;margin:0 auto}
.video-box{position:relative;background:#0a1d44;border-radius:var(--r);overflow:hidden;aspect-ratio:1/1;margin-bottom:12px}
.video-box video{width:100%;height:100%;object-fit:cover;display:block}
.reticle{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 999px rgba(5,20,60,.35);pointer-events:none}
.reticle::before,.reticle::after{content:"";position:absolute;left:8%;right:8%;height:2px;background:#6fa4ff;top:50%;opacity:.0}
.video-box.live .reticle::before{opacity:.9;animation:sweep 2s ease-in-out infinite}
@keyframes sweep{0%,100%{top:12%}50%{top:88%}}
@media(prefers-reduced-motion:reduce){.video-box.live .reticle::before{animation:none;top:50%}}
.vid-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;padding:20px;font-weight:700}
.result{border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:center;margin-top:12px;border:2px solid}
.result.ok{background:var(--ok-bg);border-color:var(--ok)} .result.warn{background:var(--warn-bg);border-color:var(--warn)}
.result.bad{background:var(--bad-bg);border-color:var(--bad)} .result.info{background:var(--info-bg);border-color:var(--info)}
.result h3{font-size:1.15rem;margin-bottom:2px}
.result .av{width:64px;height:84px}

/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--white)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--sky);color:var(--blue-d);position:sticky;top:0}
td input,td select{min-height:36px;padding:4px 8px;min-width:110px}
td.nm input{min-width:210px}
.mx td,.mx th{text-align:center;padding:6px 7px}
.mx td:first-child,.mx th:first-child{text-align:right;position:sticky;right:0;background:var(--white)}
.mx th:first-child{background:var(--sky)}
.sym{font-weight:800}
.sym.present{color:var(--ok)} .sym.late{color:var(--warn)} .sym.absent{color:var(--bad)} .sym.leave{color:var(--info)} .sym.none{color:#b5c0d6}
tr.dupe td{background:var(--warn-bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--white);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;color:var(--blue-d);min-height:36px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px;background:var(--white)}
.seg button{flex:1;border:none;background:none;padding:10px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--blue);color:#fff}
.drop{border:2px dashed var(--blue-m);background:var(--sky);border-radius:var(--r);padding:26px 14px;text-align:center;cursor:pointer;font-weight:700;color:var(--blue-d)}
.drop.drag{background:#d8e7ff}
.note{background:var(--info-bg);border-radius:10px;padding:10px 14px;font-size:.9rem;margin-bottom:12px;color:var(--blue-d)}
.err{color:var(--bad);min-height:1.4em;font-weight:600;margin-bottom:8px}
.cards2{display:grid;gap:12px}
@media(min-width:760px){.cards2{grid-template-columns:1fr 1fr}}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(5,1fr)}}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{font-size:1.4rem;display:block;color:var(--blue-d)}
.kpi span{font-size:.82rem;color:var(--muted);font-weight:600}
.pct{display:inline-block;min-width:46px;text-align:center;font-weight:800}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(180deg,var(--blue) 0 38%,var(--sky-2) 38%)}
.login-card{width:100%;max-width:380px;padding:26px 22px}
.login-card .logo{width:64px;height:64px;margin:-58px auto 12px;background:#fff;border-radius:18px;display:grid;place-items:center;box-shadow:var(--sh);border:1px solid var(--line)}
.login-card .logo svg{width:42px;height:42px}
.login-card h1{text-align:center;font-size:1.3rem;color:var(--blue-d)}
.login-card p{text-align:center;margin:4px 0 18px}

/* toasts */
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:90;display:grid;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--blue-d);color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;box-shadow:var(--sh);transition:opacity .4s}
.toast.bad{background:var(--bad)} .toast.out{opacity:0}

/* print */
#printArea{display:none}
@media print{
  @page{size:A4;margin:8mm}
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block}
  body{background:#fff;font-size:12px}
  .sheet{display:grid;grid-template-columns:repeat(2,85.6mm);gap:4mm 6mm;justify-content:center;direction:rtl}
  .sheet img.pc{width:85.6mm;height:54mm;display:block;break-inside:avoid;border:.2mm solid #9db6e4;border-radius:2mm}
  .rep-print{direction:rtl;font-family:'Cairo',Tahoma,sans-serif}
  .rep-print h2{margin-bottom:2px} .rep-print .meta{color:#555;margin-bottom:10px}
  .rep-print table{font-size:11px} .rep-print th{position:static;background:#e8eefb!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rep-print .kpis{grid-template-columns:repeat(5,1fr)}
  .rep-print .tbl-wrap{border:none;overflow:visible}
  .rep-print .mx td:first-child,.rep-print .mx th:first-child{position:static}
  .sheet img.pc,.rep-print *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>
<div id="modalRoot"></div>
<div id="toasts"></div>
<script>
'use strict';
/* ====================== أدوات عامة ====================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cmpAr = (a, b) => String(a || '').localeCompare(String(b || ''), 'ar');
const VIEWS = {};
const S = { user: null, settings: {}, students: [], byId: {}, today: '', rev: 0, cur: null, poll: null, view: '' };
const STATUS = {
  present: { t: 'حاضر', c: 'ok', sym: '✓' },
  late: { t: 'متأخر', c: 'warn', sym: 'ت' },
  absent: { t: 'غائب', c: 'bad', sym: 'غ' },
  leave: { t: 'إجازة', c: 'info', sym: 'إ' },
  none: { t: 'لم يُسجَّل', c: 'mute', sym: '–' },
};
const isAdmin = () => !!S.user && S.user.role === 'admin';
const badge = (st) => `<span class="badge ${STATUS[st].c}">${STATUS[st].t}</span>`;
const LOGO = '<svg viewBox="0 0 96 96"><g fill="#1456c8"><rect x="14" y="14" width="26" height="26" rx="5"/><rect x="56" y="14" width="26" height="26" rx="5"/><rect x="14" y="56" width="26" height="26" rx="5"/><rect x="56" y="56" width="11" height="11"/><rect x="71" y="71" width="11" height="11"/><rect x="71" y="56" width="11" height="11"/></g><g fill="#fff"><rect x="21" y="21" width="12" height="12"/><rect x="63" y="21" width="12" height="12"/><rect x="21" y="63" width="12" height="12"/></g></svg>';

function normSearch(s) {
  return String(s || '').normalize('NFKC').replace(/[\u064B-\u065F\u0670\u0640]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/\s+/g, ' ').trim().toLowerCase();
}

/* ---- التواريخ ---- */
const DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
const dow = (d) => new Date(d + 'T00:00:00Z').getUTCDay();
function addDays(d, n) { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); }
const fmtDate = (d) => `${DAYS[dow(d)]} ${d}`;
const weekStart = (d) => addDays(d, -dow(d));
const weekendSet = () => new Set(String(S.settings.weekend ?? '5,6').split(',').filter((x) => x !== '').map(Number));
const isSchoolDay = (d) => !weekendSet().has(dow(d));
const hm = (t) => (t ? String(t).slice(0, 5) : '');
function dateRange(from, to) { const o = []; for (let d = from; d <= to; d = addDays(d, 1)) { o.push(d); if (o.length > 400) break; } return o; }

/* ---- حالة الطالب الفعلية ليوم ما ---- */
function effStatus(rec, onLeave, date) {
  if (rec) return rec.status;
  if (onLeave) return 'leave';
  return date < S.today ? 'absent' : 'none';
}

/* ====================== واجهة: رسائل ونوافذ ====================== */
function toast(msg, type = 'ok') {
  const t = document.createElement('div');
  t.className = 'toast ' + type; t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.classList.add('out'), 2800);
  setTimeout(() => t.remove(), 3300);
}
function modal(html, { wide = false, onClose } = {}) {
  const root = $('#modalRoot');
  const el = document.createElement('div');
  el.className = 'modal-bg';
  el.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true"><button class="x" aria-label="إغلاق">×</button>${html}</div>`;
  root.appendChild(el);
  document.body.classList.add('noscroll');
  el.close = () => { if (!el.isConnected) return; el.remove(); if (!root.children.length) document.body.classList.remove('noscroll'); if (onClose) onClose(); };
  el.addEventListener('mousedown', (e) => { if (e.target === el) el.close(); });
  $('.x', el).onclick = el.close;
  return el;
}
const anyModal = () => $('#modalRoot').children.length > 0;
function confirmBox(msg, okText = 'تأكيد', danger = false) {
  return new Promise((res) => {
    const m = modal(`<p class="confirm-msg">${esc(msg)}</p><div class="row end gap"><button class="btn" data-n>إلغاء</button><button class="btn ${danger ? 'danger' : 'primary'}" data-y>${esc(okText)}</button></div>`, { onClose: () => res(false) });
    $('[data-n]', m).onclick = () => m.close();
    $('[data-y]', m).onclick = () => { res(true); m.close(); };
  });
}

/* ====================== الاتصال بالخادم ====================== */

async function loadStudents() {
  S.students = await api('/students');
  S.byId = {}; S.students.forEach((s) => { S.byId[s.id] = s; });
}

/* ====================== تحميل المكتبات عند الحاجة ====================== */
const LIBS = {
  qr: { test: () => window.qrcode, urls: ['https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js', 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js'] },
  jsqr: { test: () => window.jsQR, urls: ['https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js', 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'] },
  pdf: { test: () => window.pdfjsLib, urls: ['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js'] },
  ocr: { test: () => window.Tesseract, urls: ['https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'] },

const PDF_WORKERS = ['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js', 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'];
const _loading = {};
function loadScript(u) {
  return new Promise((ok, no) => {
    const e = document.createElement('script');
    e.src = u; e.onload = ok; e.onerror = () => { e.remove(); no(new Error('fail')); };
    document.head.appendChild(e);
  });
}
async function lib(name) {
  const L = LIBS[name];
  if (L.test()) return;
  if (!_loading[name]) {
    _loading[name] = (async () => {
      for (const u of L.urls) { try { await loadScript(u); if (L.test()) return; } catch { /* جرّب التالي */ } }
      throw new Error('تعذّر تحميل مكتبة مطلوبة. تحقق من الإنترنت أو ضع ملفات المكتبات في public/vendor (انظر README).');
    })();
  }
  try { await _loading[name]; } catch (e) { delete _loading[name]; throw e; }
}
async function pdfReady() {
  await lib('pdf');
  if (window.pdfjsLib._ready) return;
  for (const u of PDF_WORKERS) {
    try {
      const r = await fetch(u); if (!r.ok) continue;
      const t = await r.text();
      pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([t], { type: 'text/javascript' }));
      pdfjsLib._ready = true; return;
    } catch { /* التالي */ }
  }
  throw new Error('تعذّر تحميل محرك قراءة PDF.');
}

/* ====================== QR والبطاقات ====================== */
function qrCanvas(text, px = 512, margin = 2) {
  const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
  const n = qr.getModuleCount();
  const cell = Math.max(2, Math.floor(px / (n + margin * 2)));
  const size = cell * (n + margin * 2);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, size, size);
  x.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (qr.isDark(r, k)) x.fillRect((k + margin) * cell, (r + margin) * cell, cell, cell);
  return c;
}
const FONT = "'Cairo','Segoe UI',Tahoma,Arial,sans-serif";
function wrapLines(x, text, maxW) {
  const words = String(text).split(' '); const lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (x.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
function fitText(x, text, maxW, sizes, weight, maxLines) {
  for (const sz of sizes) {
    x.font = `${weight} ${sz}px ${FONT}`;
    const lines = wrapLines(x, text, maxW);
    if (lines.length <= maxLines) return { lines, sz };
  }
  const sz = sizes[sizes.length - 1]; x.font = `${weight} ${sz}px ${FONT}`;
  return { lines: wrapLines(x, text, maxW).slice(0, maxLines), sz };
}
async function drawCard(s) {
  await lib('qr');
  if (document.fonts) { try { await document.fonts.load(`800 30px Cairo`); await document.fonts.load(`600 24px Cairo`); } catch { /* تجاهل */ } }
  const W = 1012, H = 638;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.direction = 'rtl'; x.textBaseline = 'middle';
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#1456c8'; x.fillRect(0, 0, W, 118);
  x.fillStyle = '#fff'; x.textAlign = 'center';
  x.font = `800 40px ${FONT}`; x.fillText(S.settings.school_name || '', W / 2, 48);
  x.font = `600 25px ${FONT}`; x.fillStyle = '#cfe0ff'; x.fillText('بطاقة الحضور والغياب', W / 2, 90);
  x.fillStyle = '#1456c8'; x.fillRect(0, H - 22, W, 22);
  // الصورة (يمين)
  const pw = 230, ph = 307, px = W - 46 - pw, py = 150;
  x.fillStyle = '#eaf2ff'; x.fillRect(px, py, pw, ph);
  let drew = false;
  if (s.has_photo) { try { const im = await loadImg(`/api/photo/${s.id}?v=${s.updated_at}`); x.drawImage(im, px, py, pw, ph); drew = true; } catch { /* بدون صورة */ } }
  if (!drew) { x.fillStyle = '#1456c8'; x.textAlign = 'center'; x.font = `800 110px ${FONT}`; x.fillText((s.name || '?')[0], px + pw / 2, py + ph / 2); }
  x.strokeStyle = '#1456c8'; x.lineWidth = 4; x.strokeRect(px, py, pw, ph);
  // QR (يسار)
  const qc = qrCanvas(s.code, 300, 1);
  x.drawImage(qc, 44, 160, 290, 290);
  x.strokeStyle = '#d6e3f8'; x.lineWidth = 3; x.strokeRect(44, 160, 290, 290);
  // النص (وسط)
  const xr = px - 28, maxW = xr - 360;
  x.textAlign = 'right'; x.fillStyle = '#0b2f73';
  const nm = fitText(x, s.name, maxW, [38, 34, 30, 26], 800, 3);
  let y = 185;
  x.font = `800 ${nm.sz}px ${FONT}`;
  for (const ln of nm.lines) { x.fillText(ln, xr, y); y += nm.sz * 1.3; }
  y += 14; x.font = `600 28px ${FONT}`; x.fillStyle = '#4a5f87';
  for (const [k, v] of [['المرحلة', s.stage], ['القسم', s.section], ['القاعة', s.hall]]) { if (v) { x.fillText(`${k}: ${v}`, xr, y); y += 44; } }
  x.textAlign = 'center'; x.fillStyle = '#7d8fb3'; x.font = '600 22px monospace'; x.direction = 'ltr';
  x.fillText(s.code, 189, 482);
  return c;
}
async function qrCaptionCanvas(s) {
  await lib('qr');
  if (document.fonts) { try { await document.fonts.load('800 30px Cairo'); } catch { /* تجاهل */ } }
  const W = 720, H = 840;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.direction = 'rtl'; x.textBaseline = 'middle';
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);

function fileToPhoto(file, w = 300, h = 400) {
  return new Promise((ok, no) => {
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d');
      const r = Math.max(w / img.width, h / img.height);
      const dw = img.width * r, dh = img.height * r;
      x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
      x.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
      URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(u); no(new Error('تعذّر قراءة الصورة')); };
    img.src = u;
  });
}

   النسخة المحلية: قاعدة بيانات داخل المتصفح (IndexedDB) بدل الخادم.

const LDB = { data: null };
let _ldbP = null;
const LE = (m, st = 400) => { const e = new Error(m); e.status = st; return e; };
const lstr = (v, max = 200) => String(v ?? '').normalize('NFC').trim().replace(/\s+/g, ' ').slice(0, max);
const lisDate = (d) => typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d) && !isNaN(Date.parse(d));
const LTZ = 'Asia/Baghdad';

/* ---------- التخزين ---------- */
function idbOpen() {
  return new Promise((ok, no) => {
    const tm = setTimeout(() => no(new Error('idb timeout')), 4000);
    const r = indexedDB.open('nahrain-attendance', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => { clearTimeout(tm); ok(r.result); }; r.onerror = () => { clearTimeout(tm); no(r.error); }; r.onblocked = () => { clearTimeout(tm); no(new Error('blocked')); };
  });
}
async function idbGet() {
  try {
    const db = await idbOpen();
    return await new Promise((ok, no) => { const t = db.transaction('kv').objectStore('kv').get('db'); t.onsuccess = () => ok(t.result); t.onerror = () => no(t.error); });
  } catch { try { return JSON.parse(localStorage.getItem('nh_db') || 'null'); } catch { return null; } }
}
async function idbSet(v) {
  try {
    const db = await idbOpen();
    await new Promise((ok, no) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, 'db'); tx.oncomplete = ok; tx.onerror = () => no(tx.error); });
  } catch { localStorage.setItem('nh_db', JSON.stringify(v)); }
}
function ldbDefault() {
  return { v: 1, rev: 1, seq: { student: 0, user: 0, leave: 0, att: 0 }, users: [], students: [], attendance: [], leaves: [],
    settings: { school_name: 'إعدادية النهرين المهنية الأهلية', start_time: '07:30', late_minutes: '10', weekend: '5,6' } };
}
function ldbReady() {
  if (!_ldbP) _ldbP = (async () => {
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch { /* تجاهل */ }
    let d = await idbGet();
    if (!d || !Array.isArray(d.users)) d = ldbDefault();
    LDB.data = d;
  })();
  return _ldbP;
}
async function lcommit() { LDB.data.rev++; await idbSet(LDB.data); }

/* ---------- أدوات ---------- */
function lnow() {
  const p = new Intl.DateTimeFormat('en-CA', { timeZone: LTZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());
  const g = (t) => p.find((x) => x.type === t).value;
  return { date: `${g('year')}-${g('month')}-${g('day')}`, time: `${g('hour')}:${g('minute')}:${g('second')}` };
}
function lIsLate(time, cfg) {
  const [sh, sm] = String(cfg.start_time || '07:30').split(':').map(Number);
  const [h, m] = time.split(':').map(Number);
  return h * 60 + m > sh * 60 + sm + (+cfg.late_minutes || 0);
}
const hex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
const unhex = (s) => new Uint8Array(s.match(/../g).map((h) => parseInt(h, 16)));
const lrand = (n) => { const a = new Uint8Array(n); crypto.getRandomValues(a); return hex(a); };
async function lhash(pw, salt) {
  if (window.crypto && crypto.subtle) {
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return hex(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: unhex(salt), iterations: 100000, hash: 'SHA-256' }, key, 256));
  }
  let h = 5381; const s = salt + pw; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return 'x' + h;
}
async function lmakePw(pw) { const salt = lrand(16); return { salt, hash: await lhash(pw, salt) }; }
async function lcheckPw(pw, u) { return (await lhash(String(pw || ''), u.salt)) === u.hash; }
const lpubUser = (u) => ({ id: u.id, username: u.username, name: u.name, role: u.role });
function lcurUser() {
  const id = +localStorage.getItem('nh_uid');
  return LDB.data.users.find((u) => u.id === id && u.active) || null;
}

function lfields(b) { return { name: lstr(b.name, 120), stage: lstr(b.stage, 60), section: lstr(b.section, 80), hall: lstr(b.hall, 60), note: lstr(b.note, 300) }; }
function lcleanPhoto(p) {

  if (!p) return null;
  if (typeof p !== 'string' || p.length > 600000 || !/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(p)) throw LE('الصورة غير صالحة أو كبيرة جداً');

}

/* ---------- واجهة api() المحلية (نفس مسارات الخادم) ---------- */
async function api(path, opt = {}) {
  await ldbReady();
  const D = LDB.data, method = opt.method || 'GET', body = opt.body || {};
  const [p, qs] = path.split('?'); const query = new URLSearchParams(qs || '');
  const need = (...roles) => {
    const u = lcurUser();
    if (!u) { S.user = null; showLogin(); throw LE('يجب تسجيل الدخول', 401); }
    if (roles.length && !roles.includes(u.role)) throw LE('غير مصرّح لك بهذا الإجراء', 403);
    return u;
  };
  const ADM = ['admin'];
  let m;

  if (p === '/setup' && method === 'POST') {
    if (D.users.length) throw LE('تم الإعداد مسبقاً');
    const username = lstr(body.username, 40).toLowerCase(), name = lstr(body.name, 80), pw = String(body.password || '');
    if (!/^[a-z0-9_.-]{3,40}$/.test(username)) throw LE('اسم المستخدم: 3-40 حرفاً إنكليزياً أو أرقاماً');
    if (!name) throw LE('الاسم مطلوب');
    if (pw.length < 6) throw LE('كلمة المرور يجب ألا تقل عن 6 أحرف');
    const u = { id: ++D.seq.user, username, name, role: 'admin', active: true, ...(await lmakePw(pw)) };
    D.users.push(u); await lcommit(); localStorage.setItem('nh_uid', u.id);
    return { user: lpubUser(u) };
  }
  if (p === '/login' && method === 'POST') {
    const u = D.users.find((x) => x.username === lstr(body.username, 60).toLowerCase());
    if (!u || !u.active || !(await lcheckPw(body.password, u))) throw LE('اسم المستخدم أو كلمة المرور غير صحيحة', 401);
    localStorage.setItem('nh_uid', u.id);
    return { user: lpubUser(u) };
  }
  if (p === '/logout') { localStorage.removeItem('nh_uid'); return { ok: true }; }
  if (p === '/me') { const u = need(); return { user: lpubUser(u), settings: { ...D.settings }, ...lnow(), rev: D.rev }; }
  if (p === '/rev') { need(); return { rev: D.rev, ...lnow() }; }
  if (p === '/password' && method === 'POST') {
    const u = need();
    if (!(await lcheckPw(body.old, u))) throw LE('كلمة المرور الحالية غير صحيحة');
    const n = String(body.new || ''); if (n.length < 6) throw LE('كلمة المرور الجديدة يجب ألا تقل عن 6 أحرف');
    Object.assign(u, await lmakePw(n)); await lcommit(); return { ok: true };
  }

  /* الإعدادات */
  if (p === '/settings' && method === 'GET') { need(); return { ...D.settings }; }
  if (p === '/settings' && method === 'PUT') {
    need(...ADM); const out = {};
    if (body.school_name !== undefined) { out.school_name = lstr(body.school_name, 120); if (!out.school_name) throw LE('اسم المدرسة مطلوب'); }
    if (body.start_time !== undefined) { if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(body.start_time)) throw LE('وقت الدوام غير صالح'); out.start_time = body.start_time; }
    if (body.late_minutes !== undefined) { const n = Math.round(+body.late_minutes); if (!(n >= 0 && n <= 240)) throw LE('مدة السماح غير صالحة'); out.late_minutes = String(n); }
    if (body.weekend !== undefined) {
      const w = String(body.weekend).split(',').filter((x) => x !== '').map(Number);
      if (w.some((x) => !(x >= 0 && x <= 6))) throw LE('أيام العطلة غير صالحة');
      out.weekend = [...new Set(w)].join(',');
    }
    Object.assign(D.settings, out); await lcommit(); return { ...D.settings };
  }

  /* الطلاب */
  if (p === '/students' && method === 'GET') {
    const u = need();
    return D.students.map((s) => ({ ...lpubStudent(s), note: s.note, active: s.active, code: u.role === 'admin' ? s.code : undefined }));
  }
  if (p === '/students' && method === 'POST') {
    need(...ADM); const f = lfields(body); if (!f.name) throw LE('الاسم مطلوب');
    const s = { id: ++D.seq.student, code: lnewCode(), ...f, photo: lcleanPhoto(body.photo) ?? null, active: true, updated_at: Date.now() };
    D.students.push(s); await lcommit(); return { id: s.id, code: s.code };
  }
  if (p === '/students/bulk' && method === 'POST') {
    need(...ADM);
    const list = Array.isArray(body.students) ? body.students.slice(0, 3000) : [];
    if (!list.length) throw LE('لا توجد بيانات للإضافة');
    const seen = new Set(D.students.map((s) => lkey(s.name, s.stage, s.section)));
    let added = 0, skipped = 0;
    for (const it of list) {
      const f = lfields(it); if (!f.name) { skipped++; continue; }
      const k = lkey(f.name, f.stage, f.section); if (seen.has(k)) { skipped++; continue; }
      seen.add(k); D.students.push({ id: ++D.seq.student, code: lnewCode(), ...f, note: '', photo: null, active: true, updated_at: Date.now() }); added++;
    }
    if (added) await lcommit();
    return { added, skipped };
  }
  if ((m = /^\/students\/(\d+)\/regen-code$/.exec(p)) && method === 'POST') {
    need(...ADM); const s = D.students.find((x) => x.id === +m[1]); if (!s) throw LE('الطالب غير موجود', 404);
    s.code = lnewCode(); s.updated_at = Date.now(); await lcommit(); return { code: s.code };
  }
  if ((m = /^\/students\/(\d+)$/.exec(p)) && method === 'PUT') {
    need(...ADM); const s = D.students.find((x) => x.id === +m[1]); if (!s) throw LE('الطالب غير موجود', 404);
    const f = lfields({ ...s, ...body }); if (!f.name) throw LE('الاسم مطلوب');
    const photo = 'photo' in body ? lcleanPhoto(body.photo) : s.photo;
    Object.assign(s, f, { photo: photo ?? null, active: body.active === undefined ? s.active : !!body.active, updated_at: Date.now() });
    await lcommit(); return { ok: true };
  }
  if ((m = /^\/students\/(\d+)$/.exec(p)) && method === 'DELETE') {
    need(...ADM); const id = +m[1];
    D.students = D.students.filter((s) => s.id !== id); D.attendance = D.attendance.filter((a) => a.student_id !== id); D.leaves = D.leaves.filter((l) => l.student_id !== id);
    await lcommit(); return { ok: true };
  }

  /* المسح والحضور */
  if (p === '/scan' && method === 'POST') {
    const u = need();
    const st = body.student_id !== undefined ? D.students.find((s) => s.id === +body.student_id) : D.students.find((s) => s.code === lstr(body.code, 64).toUpperCase());
    if (!st) return { result: 'unknown' };
    if (!st.active) return { result: 'inactive', student: lpubStudent(st) };
    const { date, time } = lnow();
    const ex = D.attendance.find((a) => a.student_id === st.id && a.date === date);
    if (ex && (ex.status === 'present' || ex.status === 'late')) return { result: 'duplicate', student: lpubStudent(st), status: ex.status, time: ex.time, date };
    const status = lIsLate(time, D.settings) ? 'late' : 'present';
    if (ex) Object.assign(ex, { status, time, source: 'scan', by_user: u.id });
    else D.attendance.push({ id: ++D.seq.att, student_id: st.id, date, status, time, note: '', source: 'scan', by_user: u.id });
    await lcommit(); return { result: 'ok', student: lpubStudent(st), status, time, date };
  }
  if (p === '/attendance' && method === 'GET') {
    need(); const date = query.get('date');
    const cp = (a) => ({ student_id: a.student_id, date: a.date, status: a.status, time: a.time, note: a.note, source: a.source });
    if (date) {
      if (!lisDate(date)) throw LE('تاريخ غير صالح');
      return { records: D.attendance.filter((a) => a.date === date).map(cp), leave_ids: [...new Set(D.leaves.filter((l) => l.from_date <= date && l.to_date >= date).map((l) => l.student_id))] };
    }
    const from = query.get('from'), to = query.get('to');
    if (!lisDate(from) || !lisDate(to) || from > to) throw LE('نطاق التاريخ غير صالح');
    if ((Date.parse(to) - Date.parse(from)) / 864e5 > 370) throw LE('النطاق أكبر من سنة');
    return { records: D.attendance.filter((a) => a.date >= from && a.date <= to).map(cp) };
  }
  if (p === '/attendance' && method === 'PUT') {
    const u = need(...ADM); const sid = +body.student_id, date = body.date, status = body.status;
    if (!lisDate(date)) throw LE('تاريخ غير صالح');
    if (!D.students.some((s) => s.id === sid)) throw LE('الطالب غير موجود', 404);
    const ex = D.attendance.find((a) => a.student_id === sid && a.date === date);
    if (status === 'none') D.attendance = D.attendance.filter((a) => a !== ex);
    else {
      if (!['present', 'late', 'absent', 'leave'].includes(status)) throw LE('حالة غير صالحة');
      const note = lstr(body.note, 300);
      if (ex) Object.assign(ex, { status, note, source: 'manual', by_user: u.id, time: (status === 'absent' || status === 'leave') ? null : ex.time });
      else D.attendance.push({ id: ++D.seq.att, student_id: sid, date, status, time: null, note, source: 'manual', by_user: u.id });
    }
    await lcommit(); return { ok: true };
  }
  if (p === '/attendance/close-day' && method === 'POST') {
    const u = need(...ADM); const date = body.date; if (!lisDate(date)) throw LE('تاريخ غير صالح');
    let absent = 0, leave = 0;
    const has = new Set(D.attendance.filter((a) => a.date === date).map((a) => a.student_id));
    for (const s of D.students) {
      if (!s.active || has.has(s.id)) continue;
      const onLeave = D.leaves.some((l) => l.student_id === s.id && l.from_date <= date && l.to_date >= date);
      D.attendance.push({ id: ++D.seq.att, student_id: s.id, date, status: onLeave ? 'leave' : 'absent', time: null, note: '', source: 'auto', by_user: u.id });
      onLeave ? leave++ : absent++;
    }
    await lcommit(); return { absent, leave };
  }

  /* الإجازات */
  if (p === '/leaves' && method === 'GET') { need(...ADM); return D.leaves.map((l) => ({ ...l })).sort((a, b) => b.from_date.localeCompare(a.from_date) || b.id - a.id); }
  if (p === '/leaves' && method === 'POST') {
    need(...ADM); const sid = +body.student_id;
    if (!D.students.some((s) => s.id === sid)) throw LE('اختر الطالب');
    if (!lisDate(body.from_date) || !lisDate(body.to_date) || body.from_date > body.to_date) throw LE('تواريخ الإجازة غير صالحة');
    D.leaves.push({ id: ++D.seq.leave, student_id: sid, from_date: body.from_date, to_date: body.to_date, reason: lstr(body.reason, 200) });
    await lcommit(); return { ok: true };
  }
  if ((m = /^\/leaves\/(\d+)$/.exec(p)) && method === 'DELETE') { need(...ADM); D.leaves = D.leaves.filter((l) => l.id !== +m[1]); await lcommit(); return { ok: true }; }

  /* المستخدمون */
  if (p === '/users' && method === 'GET') { need(...ADM); return D.users.map((u) => ({ ...lpubUser(u), active: u.active })); }
  if (p === '/users' && method === 'POST') {
    need(...ADM);
    const username = lstr(body.username, 40).toLowerCase(), name = lstr(body.name, 80), pw = String(body.password || '');
    if (!/^[a-z0-9_.-]{3,40}$/.test(username)) throw LE('اسم المستخدم: 3-40 حرفاً إنكليزياً أو أرقاماً');
    if (!name) throw LE('الاسم مطلوب');
    if (pw.length < 6) throw LE('كلمة المرور يجب ألا تقل عن 6 أحرف');
    if (!['admin', 'observer'].includes(body.role)) throw LE('الدور غير صالح');
    if (D.users.some((u) => u.username === username)) throw LE('اسم المستخدم مستخدم مسبقاً');
    D.users.push({ id: ++D.seq.user, username, name, role: body.role, active: true, ...(await lmakePw(pw)) });
    await lcommit(); return { ok: true };
  }
  if ((m = /^\/users\/(\d+)$/.exec(p)) && method === 'PUT') {
    const me = need(...ADM); const u = D.users.find((x) => x.id === +m[1]); if (!u) throw LE('المستخدم غير موجود', 404);
    if (u.id === me.id && (body.active === false || (body.role && body.role !== 'admin'))) throw LE('لا يمكنك تعطيل حسابك أو تغيير دورك');
    const name = body.name !== undefined ? lstr(body.name, 80) : u.name; if (!name) throw LE('الاسم مطلوب');
    if (body.password) { if (String(body.password).length < 6) throw LE('كلمة المرور يجب ألا تقل عن 6 أحرف'); Object.assign(u, await lmakePw(String(body.password))); }
    u.name = name;
    if (body.role && ['admin', 'observer'].includes(body.role)) u.role = body.role;
    if (body.active !== undefined) u.active = !!body.active;
    await lcommit(); return { ok: true };
  }
  if ((m = /^\/users\/(\d+)$/.exec(p)) && method === 'DELETE') {
    const me = need(...ADM); if (+m[1] === me.id) throw LE('لا يمكنك حذف حسابك');
    D.users = D.users.filter((u) => u.id !== +m[1]); await lcommit(); return { ok: true };
  }
  throw LE('غير موجود', 404);
}

/* ---------- نسخ احتياطي واستعادة ---------- */
async function lExport() {
  await ldbReady();
  const blob = new Blob([JSON.stringify(LDB.data)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `attendance-backup-${lnow().date}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
async function lImport(file) {
  let d; try { d = JSON.parse(await file.text()); } catch { throw LE('الملف ليس نسخة احتياطية صالحة'); }
  if (!d || !Array.isArray(d.users) || !Array.isArray(d.students) || !Array.isArray(d.attendance) || !Array.isArray(d.leaves) || !d.settings || !d.seq) throw LE('الملف ليس نسخة احتياطية صالحة');
  LDB.data = d; await lcommit();
}

/* ---------- الصور: تُخزَّن داخل السجل نفسه ---------- */
function avatar(st) { return st.has_photo && st.photo ? `<img class="av" alt="" src="${st.photo}">` : `<span class="av ph">${esc((st.name || '?')[0])}</span>`; }
function loadImg(src) {
  return new Promise((ok, no) => {
    const m = /^\/api\/photo\/(\d+)/.exec(src); let u = src;
    if (m) { const s = S.byId[+m[1]]; if (!s || !s.photo) return no(new Error('no photo')); u = s.photo; }
    const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = u;
  });
}

/* ---------- شاشة الدخول / الإعداد الأول ---------- */
async function showLogin() {
  clearInterval(S.poll);
  if (S.cur && S.cur.destroy) S.cur.destroy();
  S.cur = null;
  $$('.modal-bg').forEach((x) => x.close && x.close());
  await ldbReady();
  const setup = LDB.data.users.length === 0;
  $('#app').innerHTML = `<div class="login"><form class="card login-card" id="lf" autocomplete="on">
    <div class="logo">${LOGO}</div><h1>نظام الحضور والغيابات</h1><p class="muted">${setup ? 'إعداد أول مرة: أنشئ حساب المسؤول' : 'إعدادية النهرين المهنية الأهلية'}</p>
    ${setup ? '<label>الاسم<input name="n" required maxlength="80" value="مدير النظام"></label>' : ''}
    <label>اسم المستخدم${setup ? ' (إنكليزي)' : ''}<input name="u" autocomplete="username" autocapitalize="off" required value="${setup ? 'admin' : ''}" style="direction:ltr;text-align:left"></label>
    <label>كلمة المرور${setup ? ' (6 أحرف على الأقل)' : ''}<input name="p" type="password" autocomplete="${setup ? 'new-password' : 'current-password'}" required minlength="${setup ? 6 : 1}"></label>
    <div class="err" id="lerr"></div><button class="btn primary block">${setup ? 'إنشاء الحساب والدخول' : 'دخول'}</button>
    <p class="muted center" style="font-size:.8rem;margin:12px 0 0">البيانات محفوظة داخل متصفح هذا الجهاز فقط.</p></form></div>`;
  $('#lf').onsubmit = async (e) => {
    e.preventDefault();
    const btn = $('button', e.target); btn.disabled = true; $('#lerr').textContent = '';
    try {
      if (setup) await api('/setup', { method: 'POST', body: { name: e.target.n.value, username: e.target.u.value, password: e.target.p.value } });
      else await api('/login', { method: 'POST', body: { username: e.target.u.value, password: e.target.p.value } });
      await boot();
    } catch (er) { $('#lerr').textContent = er.message; btn.disabled = false; }
  };
}

/* ---------- إظهار أي خطأ بدل الشاشة البيضاء ---------- */
function showFatal(msg) {
  const a = document.getElementById('app');
  if (a && !a.innerHTML.trim()) a.innerHTML = '<div style="padding:24px;font-family:sans-serif;direction:rtl"><h3>تعذّر تشغيل النظام</h3><p style="direction:ltr;text-align:left;color:#c62828;word-break:break-word">' + String(msg).replace(/</g, '&lt;') + '</p><p>أرسل لي هذه الرسالة لأصلح المشكلة.</p></div>';
}
window.addEventListener('error', (e) => showFatal(e.message));
window.addEventListener('unhandledrejection', (e) => showFatal((e.reason && e.reason.message) || e.reason));

'use strict';
/* ====================== لوحة اليوم / الحضور اليومي ====================== */
VIEWS.dash = function (root) {
  const st = { date: S.today, q: '', stage: '', section: '', hall: '', status: '' };
  let att = { records: new Map(), leave: new Set() };
  const admin = isAdmin();
  root.innerHTML = `<section>
    <div class="page-h"><h2>${admin ? 'لوحة الحضور' : 'حضور اليوم'}</h2>
      <div class="acts">${admin ? `<input type="date" id="dDate" value="${st.date}" aria-label="التاريخ"><button class="btn" id="closeDay">اعتماد الغياب</button>` : `<span class="badge info" id="dLabel"></span>`}</div></div>
    <div class="stats" id="stats"></div>
    <div id="fbar">${filterHTML(st, { status: true })}</div>
    <div class="card list" id="list"></div></section>`;

  async function load() {
    const r = await api('/attendance?date=' + st.date);
    att.records = new Map(r.records.map((x) => [x.student_id, x]));
    att.leave = new Set(r.leave_ids);
    draw();
  }
  function rows() {
    return S.students.filter((s) => s.active).map((s) => {
      const rec = att.records.get(s.id);
      return { s, rec, eff: effStatus(rec, att.leave.has(s.id), st.date) };
    });
  }
  function draw() {
    const all = rows();
    const cnt = { total: all.length, present: 0, late: 0, absent: 0, leave: 0, none: 0 };
    all.forEach((r) => { cnt[r.eff]++; });
    const lab = $('#dLabel'); if (lab) lab.textContent = fmtDate(st.date);
    const tiles = [['', 'الإجمالي', cnt.total, ''], ['present', 'حاضر', cnt.present, 'ok'], ['late', 'متأخر', cnt.late, 'warn'], ['absent', 'غائب', cnt.absent, 'bad'], ['leave', 'إجازة', cnt.leave, ''], ['none', 'لم يُسجَّل', cnt.none, '']];
    $('#stats').innerHTML = tiles.map(([k, t, n, c]) => `<button class="stat ${c} ${st.status === k ? 'on' : ''}" data-k="${k}"><b>${n}</b><span>${t}</span></button>`).join('');
    $$('#stats .stat').forEach((b) => b.onclick = () => { st.status = b.dataset.k; const sel = $('[data-f=status]'); if (sel) sel.value = st.status; draw(); });
    const list = all.filter((r) => matchStudent(r.s, st) && (!st.status || r.eff === st.status)).sort((a, b) => sortStudents(a.s, b.s));
    $('#list').innerHTML = list.length ? list.map(({ s, rec, eff }) => `<div class="item" data-id="${s.id}">${avatar(s)}
      <div class="grow"><b>${esc(s.name)}</b><small>${esc([s.stage, s.section, s.hall].filter(Boolean).join(' • '))}</small>${rec && rec.note ? `<small>📝 ${esc(rec.note)}</small>` : ''}</div>
      <div class="side">${rec && rec.time ? `<span class="tm">${hm(rec.time)}</span>` : ''}
      ${admin ? `<select class="st-sel" aria-label="الحالة">${['none', 'present', 'late', 'absent', 'leave'].map((k) => `<option value="${k}" ${k === eff ? 'selected' : ''}>${STATUS[k].t}${!rec && k === eff && eff === 'absent' ? ' (تلقائي)' : ''}</option>`).join('')}</select><button class="btn sm" data-note title="ملاحظة">📝</button>` : badge(eff)}</div></div>`).join('')
      : '<div class="empty">لا توجد نتائج مطابقة</div>';
    if (admin) {
      $$('#list .st-sel').forEach((sel) => sel.onchange = async () => {
        const id = +sel.closest('.item').dataset.id;
        try {
          await api('/attendance', { method: 'PUT', body: { student_id: id, date: st.date, status: sel.value, note: (att.records.get(id) || {}).note || '' } });
          await load();
        } catch (e) { toast(e.message, 'bad'); load(); }
      });
      $$('#list [data-note]').forEach((b) => b.onclick = () => noteModal(+b.closest('.item').dataset.id));
    }
  }
  function noteModal(id) {
    const s = S.byId[id], rec = att.records.get(id);
    const m = modal(`<h3>ملاحظة — ${esc(s.name)}</h3><p class="muted">${fmtDate(st.date)}</p>
      <label>الحالة<select id="nSt">${['present', 'late', 'absent', 'leave'].map((k) => `<option value="${k}" ${(rec ? rec.status : 'absent') === k ? 'selected' : ''}>${STATUS[k].t}</option>`).join('')}</select></label>
      <label>الملاحظة<textarea id="nTx" rows="3" maxlength="300">${esc(rec ? rec.note : '')}</textarea></label>
      <div class="row end gap"><button class="btn" data-c>إلغاء</button><button class="btn primary" data-s>حفظ</button></div>`);
    $('[data-c]', m).onclick = () => m.close();
    $('[data-s]', m).onclick = async () => {
      try { await api('/attendance', { method: 'PUT', body: { student_id: id, date: st.date, status: $('#nSt', m).value, note: $('#nTx', m).value } }); m.close(); load(); toast('تم الحفظ'); }
      catch (e) { toast(e.message, 'bad'); }
    };
  }
  bindFilters(root, st, draw);
  if (admin) {
    $('#dDate').onchange = (e) => { if (e.target.value) { st.date = e.target.value; load(); } };
    $('#closeDay').onclick = async () => {
      if (st.date > S.today) return toast('لا يمكن اعتماد الغياب لتاريخ مستقبلي', 'bad');
      if (!(await confirmBox(`سيتم تسجيل «غائب» لكل طالب لم يُسجَّل حضوره ليوم ${st.date} (ومن لديه إجازة تُسجَّل له إجازة). متابعة؟`, 'اعتماد'))) return;
      try { const r = await api('/attendance/close-day', { method: 'POST', body: { date: st.date } }); toast(`تم: ${r.absent} غائب، ${r.leave} إجازة`); load(); }
      catch (e) { toast(e.message, 'bad'); }
    };
  }
  load().catch((e) => toast(e.message, 'bad'));
  return { refresh: () => { if (!anyModal()) { st.date = admin ? st.date : S.today; load().catch(() => {}); } } };
};

/* ====================== ماسح QR للمراقب ====================== */
VIEWS.scan = function (root) {
  root.innerHTML = `<section class="scan-wrap">
    <div class="card"><div class="video-box" id="vbox"><video id="vid" playsinline muted></video><div class="reticle"></div><div class="vid-msg" id="vmsg">اضغط «تشغيل الكاميرا» ثم وجّهها نحو رمز QR الخاص بالطالب</div></div>
      <div class="row gap wrap"><button class="btn primary grow" id="camBtn">تشغيل الكاميرا</button><button class="btn" id="flipBtn">تبديل الكاميرا</button></div>
      <div id="result"></div></div>

'use strict';
/* ====================== استيراد الطلاب من PDF ====================== */
const nrm = (s) => String(s || '').normalize('NFKC').replace(/[\u0640\u064B-\u065F\u0670\u200E\u200F\u202A-\u202E]/g, '').replace(/\s+/g, ' ').trim();
const HDR = {
  name: /^(الاسم|اسم الطالب|اسم الطالبة|الطالب|الطالبة|الاسم الرباعي|الاسم الثلاثي|الاسم الكامل)/,
  stage: /^(المرحلة|المرحله|الصف)/,
  section: /^(القسم|الفرع|الاختصاص|التخصص)/,
  hall: /^(القاعة|القاعه|الشعبة|الشعبه)/,
};
const LABELS = 'الاسم الكامل|اسم الطالبة|اسم الطالب|الاسم|المرحلة|المرحله|الصف|القسم|الفرع|القاعة|القاعه|الشعبة|الشعبه';
const LABEL_RE = new RegExp(`(${LABELS})\\s*[:：]\\s*([^:：]*?)(?=\\s+(?:${LABELS})\\s*[:：]|$)`, 'g');
const STAGE_RE = /(^|\s)(الأول|الاول|الثاني|الثالث|الرابع|الخامس|السادس|اول|ثاني|ثالث|رابع|خامس|سادس|[1-6])(\s|$)/;
const NOISE_RE = /(إعدادية|اعدادية|مديرية|وزارة|جدول|قائمة|كشف|الصفحة|التاريخ|العام الدراسي|المدرسة|المجموع)/;
const dupKey = (n, a, b) => [n, a, b].map((x) => normSearch(x).replace(/\s/g, '')).join('|');

function stripLabel(c, re) { return c.replace(new RegExp(`^(?:${re})\\s*[:：\\-]\\s*`), ''); }
function rowToRec(cells) {
  const rec = { name: '', stage: '', section: '', hall: '' }; const rest = [];
  for (let c of cells) {
    c = nrm(c); if (!c) continue;
    if (/^[\d\u0660-\u0669\s.\-/):(]+$/.test(c)) continue;
    if (!rec.hall && /^(القاعة|القاعه|الشعبة|الشعبه|قاعة|قاعه|شعبة|شعبه)/.test(c)) { rec.hall = stripLabel(c, 'القاعة|القاعه|الشعبة|الشعبه') || c; continue; }
    if (!rec.stage && c.split(' ').length <= 4 && (STAGE_RE.test(c) || /^(المرحلة|المرحله|الصف)/.test(c))) { rec.stage = stripLabel(c, 'المرحلة|المرحله|الصف'); continue; }
    if (!rec.section && /^(قسم|فرع|القسم|الفرع)\s/.test(c)) { rec.section = stripLabel(c, 'القسم|الفرع|قسم|فرع'); continue; }
    rest.push(c);
  }
  if (!rest.length) return null;
  let ni = rest.findIndex((c) => c.split(' ').length >= 2 && /[\u0600-\u06FF]/.test(c));
  if (ni < 0) ni = 0;
  rec.name = rest.splice(ni, 1)[0];
  if (rest.length && !rec.section) rec.section = rest.shift();
  if (rest.length && !rec.hall) rec.hall = rest.shift();
  return rec;
}
function detectHeader(rows) {
  for (let i = 0; i < Math.min(rows.length, 10); i++) {
    const map = {};
    rows[i].forEach((c, idx) => { for (const k of Object.keys(HDR)) if (HDR[k].test(c) && !(k in map)) map[k] = idx; });
    if ('name' in map && Object.keys(map).length >= 2) return { i, map, n: rows[i].length };
  }
  return null;
}
function rowsToRecords(rows) {
  rows = rows.map((r) => r.map(nrm).filter(Boolean)).filter((r) => r.length);
  // وضع الاستمارات: «الاسم: ... المرحلة: ...»
  const flat = rows.map((r) => r.join(' '));
  const labelled = flat.filter((l) => /(الاسم|اسم الطالب|المرحلة|القسم|القاعة)\s*[:：]/.test(l)).length;
  if (labelled >= 3) {
    const out = []; let cur = null;
    for (const line of flat) {
      for (const m of line.matchAll(LABEL_RE)) {
        const k = m[1], v = nrm(m[2]);
        if (/^(الاسم|اسم الطالب|اسم الطالبة|الاسم الكامل)$/.test(k)) { cur = { name: v, stage: '', section: '', hall: '' }; out.push(cur); }
        else if (cur) { if (/^(المرحلة|المرحله|الصف)$/.test(k)) cur.stage = v; else if (/^(القسم|الفرع)$/.test(k)) cur.section = v; else cur.hall = v; }
      }
    }
    return out.filter((r) => r.name);
  }
  // وضع الجداول
  const hdr = detectHeader(rows);
  const wide = rows.filter((r) => r.length >= 3).length >= rows.length * 0.5;
  const out = [];
  rows.forEach((r, i) => {
    if (hdr && i <= hdr.i) return;
    if (wide && r.length < 2) return;
    if (r.some((c) => NOISE_RE.test(c)) && r.length < 3) return;
    let rec;
    if (hdr && r.length === hdr.n) {
      rec = { name: r[hdr.map.name] || '', stage: r[hdr.map.stage] || '', section: r[hdr.map.section] || '', hall: r[hdr.map.hall] || '' };
      for (const k of ['stage', 'section', 'hall']) rec[k] = stripLabel(rec[k], { stage: 'المرحلة|الصف', section: 'القسم|الفرع', hall: 'القاعة|الشعبة' }[k]);
    } else rec = rowToRec(r);
    if (rec && rec.name && /[\u0600-\u06FFA-Za-z]{2,}/.test(rec.name) && !NOISE_RE.test(rec.name)) out.push(rec);
  });
  return out;
}
function groupLines(items, factor) {
  if (!items.length) return [];
  const hs = items.map((i) => i.h || 10).sort((a, b) => a - b); const H = hs[hs.length >> 1] || 10;
  const GAP = Math.max(6, H * factor);
  items.sort((a, b) => b.y - a.y);
  const lines = [];
  for (const it of items) {
    const tol = Math.max(2.5, (it.h || H) * 0.5);
    let L = lines.find((l) => Math.abs(l.y - it.y) <= tol);
    if (!L) { L = { y: it.y, items: [] }; lines.push(L); }
    L.items.push(it);
  }
  lines.sort((a, b) => b.y - a.y);
  return lines.map((L) => {
    const its = L.items.sort((a, b) => (b.x + b.w) - (a.x + a.w));
    const cells = []; let cur = null, left = 0;
    for (const it of its) {
      if (cur && left - (it.x + it.w) <= GAP) { cur.s += ' ' + it.s; left = Math.min(left, it.x); }
      else { cur = { s: it.s }; cells.push(cur); left = it.x; }
    }
    return cells.map((c) => c.s);
  });
}
async function ocrPage(page) {
  await lib('ocr');
  const vp = page.getViewport({ scale: 2.2 });
  const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  const { data } = await Tesseract.recognize(c, 'ara');
  return data.text.split('\n').map((l) => l.trim()).filter(Boolean).map((l) => l.split(/\s{2,}|\t|\|/));
}

VIEWS.import = function (root) {
  const D = { mode: 'pdf', raw: [], textRows: [], recs: [], factor: 1.1, reverse: false, defs: { stage: '', section: '', hall: '' }, files: [] };
  root.innerHTML = `<section>
    <div class="page-h"><h2>استيراد الطلاب</h2></div>
    <div class="seg"><button data-m="pdf" class="on">من ملفات PDF</button><button data-m="text">لصق نص / جدول</button></div>
    <div id="src"></div><div id="rev"></div></section>`;
  const srcEl = $('#src'), revEl = $('#rev');

  function renderSrc() {
    $$('.seg button', root).forEach((b) => b.classList.toggle('on', b.dataset.m === D.mode));
    if (D.mode === 'pdf') {
      srcEl.innerHTML = `<div class="note">يقرأ النظام النص داخل ملف PDF ويحوّله إلى جدول قابل للتعديل <b>قبل الحفظ</b>. الملفات الممسوحة ضوئياً (صور) تُقرأ بالتعرّف الضوئي وقد تحتاج تصحيحاً أكثر. صور الطلاب تُضاف من صفحة «الطلاب».</div>
        <label class="drop" id="drop">اضغط لاختيار ملف PDF أو أكثر، أو اسحب الملفات هنا<input type="file" id="fi" accept="application/pdf,.pdf" multiple hidden></label><div id="prog" class="muted center" style="margin-top:8px"></div>`;
      const drop = $('#drop');
      $('#fi').onchange = (e) => handleFiles([...e.target.files]);
      ['dragover', 'dragenter'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('drag'); }));
      ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('drag'); }));
      drop.addEventListener('drop', (e) => handleFiles([...e.dataTransfer.files].filter((f) => /pdf$/i.test(f.name) || f.type === 'application/pdf')));
    } else {
      srcEl.innerHTML = `<div class="note">الصق أسماء الطلاب، كل طالب في سطر. يمكن الفصل بين الاسم والمرحلة والقسم والقاعة بفاصلة أو Tab أو مسافتين (مثلاً نسخ من Excel أو Word).</div>
        <textarea id="pt" rows="7" placeholder="علي حسن محمد، الثالث، التجارة، قاعة 2"></textarea><div class="row end" style="margin-top:8px"><button class="btn primary" id="ptGo">استخراج</button></div>`;
      $('#ptGo').onclick = () => {
        D.textRows = $('#pt').value.split('\n').map((l) => l.split(/\t|[;,،|]|\s{2,}/));
        D.raw = []; build();
      };
    }
  }
  async function handleFiles(files) {
    if (!files.length) return;
    const prog = $('#prog'); D.raw = []; D.textRows = []; D.files = files.map((f) => f.name);
    try {
      prog.textContent = 'جارٍ تحميل محرك القراءة…'; await pdfReady();
      for (const f of files) {
        const pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
        for (let p = 1; p <= pdf.numPages; p++) {
          prog.textContent = `${f.name} — صفحة ${p} من ${pdf.numPages}`;
          const page = await pdf.getPage(p); const tc = await page.getTextContent();
          const items = tc.items.filter((i) => i.str && i.str.trim()).map((i) => ({ s: i.str, x: i.transform[4], y: i.transform[5], w: i.width, h: i.height || Math.abs(i.transform[3]) }));
          if (items.length) D.raw.push({ f: f.name, items });
          else { prog.textContent = `${f.name} — صفحة ${p}: ملف ممسوح، جارٍ التعرّف الضوئي (قد يستغرق دقيقة)…`; try { D.textRows.push(...(await ocrPage(page))); } catch (e) { toast('تعذّر التعرّف الضوئي: ' + e.message, 'bad'); } }
        }
      }
      prog.textContent = ''; build();
    } catch (e) { prog.textContent = ''; toast(e.message || 'تعذّرت قراءة الملف', 'bad'); }
  }
  function build() {
    let rows = [...D.textRows];
    for (const pg of D.raw) rows.push(...groupLines(pg.items.map((i) => ({ ...i })), D.factor));
    if (D.reverse) rows = rows.map((r) => r.map((c) => [...c].reverse().join('')));
    const exist = new Set(S.students.map((s) => dupKey(s.name, s.stage, s.section)));
    D.recs = rowsToRecords(rows).map((r) => ({ ...r, inc: !exist.has(dupKey(r.name, r.stage, r.section)), dup: exist.has(dupKey(r.name, r.stage, r.section)) }));
    drawReview();
  }
  function drawReview() {
    if (!D.recs.length) { revEl.innerHTML = '<div class="empty card" style="margin-top:14px">لم يُستخرج أي اسم. جرّب تغيير «حساسية الأعمدة» أو «عكس النص» أدناه، أو استخدم تبويب «لصق نص».</div>' + tuning(); bindTuning(); return; }
    const n = D.recs.filter((r) => r.inc).length;
    revEl.innerHTML = `<div class="card" style="margin-top:14px"><div class="row between wrap gap" style="margin-bottom:10px"><h3>مراجعة البيانات (${D.recs.length} سجل — ${n} محدد للحفظ)</h3>
      <div class="row gap wrap"><button class="btn sm" id="allOn">تحديد الكل</button><button class="btn sm" id="allOff">إلغاء التحديد</button></div></div>
      <div class="note">راجع الأسماء وصحّح أي خطأ مباشرةً في الخانات. الصفوف الصفراء مطابقة لطالب موجود (مرحلة وقسم واسم) وتم إلغاء تحديدها.</div>
      <div class="form-grid" style="margin-bottom:4px"><label>مرحلة افتراضية للخانات الفارغة<input id="dS" list="dlS" value="${esc(D.defs.stage)}"></label><label>قسم افتراضي للخانات الفارغة<input id="dC" list="dlC" value="${esc(D.defs.section)}"></label><label>قاعة افتراضية للخانات الفارغة<input id="dH" list="dlH" value="${esc(D.defs.hall)}"></label>
      <label style="align-self:end"><button class="btn block" id="applyDef">تطبيق على الفارغ</button></label></div>
      <datalist id="dlS">${uniq('stage').map((o) => `<option value="${esc(o)}">`).join('')}</datalist><datalist id="dlC">${uniq('section').map((o) => `<option value="${esc(o)}">`).join('')}</datalist><datalist id="dlH">${uniq('hall').map((o) => `<option value="${esc(o)}">`).join('')}</datalist>
      <div class="tbl-wrap" style="max-height:60vh"><table><thead><tr><th></th><th>الاسم</th><th>المرحلة</th><th>القسم</th><th>القاعة</th><th></th></tr></thead><tbody>
      ${D.recs.map((r, i) => `<tr class="${r.dup ? 'dupe' : ''}" data-i="${i}"><td><input type="checkbox" data-k="inc" ${r.inc ? 'checked' : ''}></td>
        <td class="nm"><input data-k="name" value="${esc(r.name)}"></td><td><input data-k="stage" list="dlS" value="${esc(r.stage)}"></td><td><input data-k="section" list="dlC" value="${esc(r.section)}"></td><td><input data-k="hall" list="dlH" value="${esc(r.hall)}"></td>
        <td><button class="btn sm danger-t" data-rm>✕</button></td></tr>`).join('')}</tbody></table></div>
      ${tuning()}
      <div class="row end gap" style="margin-top:14px"><button class="btn" id="clr">مسح</button><button class="btn primary" id="saveAll">حفظ المحدد (${n})</button></div></div>`;
    $$('tbody tr', revEl).forEach((tr) => {
      const r = D.recs[+tr.dataset.i];
      $$('[data-k]', tr).forEach((el) => el.onchange = el.oninput = () => { if (el.dataset.k === 'inc') { r.inc = el.checked; updCount(); } else r[el.dataset.k] = el.value; });
      $('[data-rm]', tr).onclick = () => { D.recs.splice(+tr.dataset.i, 1); drawReview(); };
    });
    const upd = () => { D.defs = { stage: $('#dS').value, section: $('#dC').value, hall: $('#dH').value }; };
    $('#applyDef').onclick = () => { upd(); D.recs.forEach((r) => { for (const k of ['stage', 'section', 'hall']) if (!r[k] && D.defs[k]) r[k] = D.defs[k]; }); drawReview(); };
    $('#allOn').onclick = () => { D.recs.forEach((r) => { r.inc = true; }); drawReview(); };
    $('#allOff').onclick = () => { D.recs.forEach((r) => { r.inc = false; }); drawReview(); };
    $('#clr').onclick = () => { D.recs = []; D.raw = []; D.textRows = []; revEl.innerHTML = ''; };
    $('#saveAll').onclick = async () => {
      const list = D.recs.filter((r) => r.inc && r.name.trim()).map((r) => ({ name: r.name, stage: r.stage, section: r.section, hall: r.hall }));
      if (!list.length) return toast('لا توجد سجلات محددة', 'bad');
      try {
        const r = await api('/students/bulk', { method: 'POST', body: { students: list } });
        await loadStudents(); toast(`تمت إضافة ${r.added} طالباً${r.skipped ? ` (تخطي ${r.skipped} مكرر)` : ''}`);
        D.recs = []; D.raw = []; D.textRows = []; location.hash = '#/students';
      } catch (e) { toast(e.message, 'bad'); }
    };
    bindTuning();
  }
  function updCount() { const n = D.recs.filter((r) => r.inc).length; const b = $('#saveAll'); if (b) b.textContent = `حفظ المحدد (${n})`; }
  const tuning = () => D.raw.length ? `<details style="margin-top:12px"><summary class="muted" style="cursor:pointer;font-weight:700">خيارات متقدمة لقراءة الأعمدة</summary><div class="form-grid" style="margin-top:10px">
      <label>حساسية فصل الأعمدة<select id="tf"><option value="0.6" ${D.factor === 0.6 ? 'selected' : ''}>ضيّقة (أعمدة أكثر)</option><option value="1.1" ${D.factor === 1.1 ? 'selected' : ''}>متوسطة</option><option value="2.2" ${D.factor === 2.2 ? 'selected' : ''}>واسعة (أعمدة أقل)</option></select></label>
      <label class="inl" style="align-self:end"><input type="checkbox" id="trv" ${D.reverse ? 'checked' : ''}>عكس اتجاه الحروف (إذا ظهرت الأسماء مقلوبة)</label></div></details>` : '';
  function bindTuning() {
    const tf = $('#tf'), tr = $('#trv');
    if (tf) tf.onchange = () => { D.factor = +tf.value; build(); };
    if (tr) tr.onchange = () => { D.reverse = tr.checked; build(); };
  }
  $$('.seg button', root).forEach((b) => b.onclick = () => { D.mode = b.dataset.m; revEl.innerHTML = ''; renderSrc(); });
  renderSrc();
  return {};
};

      : '<div class="empty">لا توجد إجازات</div>';
    $$('#ll [data-d]').forEach((b) => b.onclick = async () => { if (!(await confirmBox('حذف هذه الإجازة؟', 'حذف', true))) return; try { await api('/leaves/' + b.dataset.d, { method: 'DELETE' }); load(); toast('تم الحذف'); } catch (e) { toast(e.message, 'bad'); } });
  }
  $('#sa').onchange = (e) => { showAll = e.target.checked; draw(); };
  $('#lf').onsubmit = async (e) => {
    e.preventDefault(); const m = /#(\d+)$/.exec($('#lSt').value.trim());
    if (!m) return toast('اختر الطالب من القائمة المقترحة', 'bad');
    try { await api('/leaves', { method: 'POST', body: { student_id: +m[1], from_date: e.target.from.value, to_date: e.target.to.value, reason: e.target.reason.value } }); e.target.reset(); toast('تم حفظ الإجازة'); load(); }
    catch (er) { toast(er.message, 'bad'); }

VIEWS.reports = function (root) {
  const st = { q: '', stage: '', section: '', hall: '', from: S.today, to: S.today };
  let data = null;
  root.innerHTML = `<section><div class="page-h"><h2>التقارير</h2><div class="acts"><button class="btn" id="rPrint">طباعة</button><button class="btn" id="rCsv">تصدير Excel (CSV)</button></div></div>
    <div class="chips" id="quick"><button class="chip on" data-r="day">اليوم</button><button class="chip" data-r="yday">أمس</button><button class="chip" data-r="week">هذا الأسبوع</button><button class="chip" data-r="lweek">الأسبوع الماضي</button><button class="chip" data-r="month">هذا الشهر</button></div>
    <div class="form-grid"><label>من<input type="date" id="rf" value="${st.from}"></label><label>إلى<input type="date" id="rt" value="${st.to}"></label></div>
    <div id="fbar">${filterHTML(st)}</div><div id="rOut"></div></section>`;
  function setRange(k) {
    const t = S.today;
    if (k === 'day') [st.from, st.to] = [t, t];
    else if (k === 'yday') { const y = addDays(t, -1); [st.from, st.to] = [y, y]; }
    else if (k === 'week') [st.from, st.to] = [weekStart(t), t];
    else if (k === 'lweek') { const w = addDays(weekStart(t), -7); [st.from, st.to] = [w, addDays(w, 6)]; }
    else if (k === 'month') [st.from, st.to] = [t.slice(0, 8) + '01', t];
    $('#rf').value = st.from; $('#rt').value = st.to;
    $$('#quick .chip').forEach((c) => c.classList.toggle('on', c.dataset.r === k));
    load();
  }
  async function load() {
    if (!st.from || !st.to || st.from > st.to) return toast('نطاق التاريخ غير صالح', 'bad');
    try {
      const [a, l] = await Promise.all([api(`/attendance?from=${st.from}&to=${st.to}`), api('/leaves')]);
      const recs = new Map(a.records.map((r) => [r.student_id + '|' + r.date, r]));
      data = { recs, leaves: l }; draw();
    } catch (e) { toast(e.message, 'bad'); }
  }
  const onLeave = (sid, d) => data.leaves.some((x) => x.student_id === sid && x.from_date <= d && x.to_date >= d);
  function compute() {
    const days = dateRange(st.from, st.to).filter(isSchoolDay);
    const studs = S.students.filter((s) => s.active && matchStudent(s, st)).sort(sortStudents);
    const rows = studs.map((s) => {
      const c = { present: 0, late: 0, absent: 0, leave: 0, none: 0 }; const cells = [];
      for (const d of days) { const rec = data.recs.get(s.id + '|' + d); const e = effStatus(rec, onLeave(s.id, d), d); c[e]++; cells.push({ d, e, rec }); }
      const base = c.present + c.late + c.absent;
      return { s, c, cells, pct: base ? Math.round(((c.present + c.late) / base) * 100) : null };
    });
    return { days, rows };
  }
  function draw() {
    if (!data) return;
    const { days, rows } = compute(); const single = st.from === st.to;
    const tot = { present: 0, late: 0, absent: 0, leave: 0 }; rows.forEach((r) => { for (const k in tot) tot[k] += r.c[k]; });
    const matrix = days.length > 1 && days.length <= 14;
    $('#rOut').innerHTML = `<div id="repBody" data-title="${single ? 'تقرير يومي — ' + fmtDate(st.from) : `تقرير من ${st.from} إلى ${st.to}`}">
      <div class="kpis"><div class="kpi"><b>${rows.length}</b><span>عدد الطلاب</span></div><div class="kpi"><b style="color:var(--ok)">${tot.present}</b><span>حضور</span></div><div class="kpi"><b style="color:var(--warn)">${tot.late}</b><span>تأخير</span></div><div class="kpi"><b style="color:var(--bad)">${tot.absent}</b><span>غياب</span></div><div class="kpi"><b style="color:var(--info)">${tot.leave}</b><span>إجازة</span></div></div>
      ${!days.length ? '<div class="note">النطاق المختار كله عطلة أسبوعية.</div>' : ''}
      ${rows.length ? `<div class="tbl-wrap"><table class="${matrix ? 'mx' : ''}"><thead><tr><th>الطالب</th><th>المرحلة / القسم</th>${single ? '<th>الحالة</th><th>الوقت</th>' : ''}${matrix ? days.map((d) => `<th title="${d}">${DAYS[dow(d)].slice(0, 3)}<br><small>${d.slice(5)}</small></th>`).join('') : ''}${single ? '' : '<th>حضور</th><th>تأخير</th><th>غياب</th><th>إجازة</th><th>النسبة</th>'}</tr></thead><tbody>
      ${rows.map((r) => `<tr><td style="text-align:right">${esc(r.s.name)}</td><td style="text-align:right">${esc([r.s.stage, r.s.section].filter(Boolean).join(' / '))}</td>
        ${single ? `<td>${r.cells[0] ? badge(r.cells[0].e) : '<span class="badge mute">عطلة</span>'}</td><td class="tm">${r.cells[0] && r.cells[0].rec ? hm(r.cells[0].rec.time) : ''}</td>` : ''}
        ${matrix ? r.cells.map((c) => `<td><span class="sym ${c.e}" title="${STATUS[c.e].t}">${STATUS[c.e].sym}</span></td>`).join('') : ''}
        ${single ? '' : `<td>${r.c.present}</td><td>${r.c.late}</td><td>${r.c.absent}</td><td>${r.c.leave}</td><td><span class="pct">${r.pct === null ? '—' : r.pct + '%'}</span></td>`}</tr>`).join('')}</tbody></table></div>
      ${matrix ? '<p class="muted" style="font-size:.85rem">✓ حاضر • ت متأخر • غ غائب • إ إجازة • – لم يُسجَّل بعد. أيام العطلة الأسبوعية غير محتسبة.</p>' : ''}` : '<div class="empty card">لا يوجد طلاب مطابقون</div>'}</div>`;
  }
  const csvRows = () => {
    const { days, rows } = compute(); const out = [['الاسم', 'المرحلة', 'القسم', 'القاعة', ...days, 'حضور', 'تأخير', 'غياب', 'إجازة', 'النسبة %']];
    rows.forEach((r) => out.push([r.s.name, r.s.stage, r.s.section, r.s.hall, ...r.cells.map((c) => STATUS[c.e].t), r.c.present, r.c.late, r.c.absent, r.c.leave, r.pct ?? '']));
    return out;
  };
  $('#quick').onclick = (e) => { const b = e.target.closest('[data-r]'); if (b) setRange(b.dataset.r); };
  $('#rf').onchange = (e) => { st.from = e.target.value; $$('#quick .chip').forEach((c) => c.classList.remove('on')); load(); };
  $('#rt').onchange = (e) => { st.to = e.target.value; $$('#quick .chip').forEach((c) => c.classList.remove('on')); load(); };
  bindFilters(root, st, draw);
  $('#rCsv').onclick = () => {
    if (!data) return;
    const csv = '\ufeff' + csvRows().map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = `تقرير-الحضور-${st.from}_${st.to}.csv`; document.body.appendChild(a); a.click(); a.remove();
  };
  $('#rPrint').onclick = () => { const b = $('#repBody'); if (!b) return; printHTML(`<div class="rep-print"><h2>${esc(S.settings.school_name)}</h2><div class="meta">${esc(b.dataset.title)} — طُبع في ${S.today}</div>${b.innerHTML}</div>`); };
  load();
  return { refresh: () => { if (!anyModal()) load(); } };
};

    <div class="card"><h3 style="margin-bottom:10px">إعدادات الدوام</h3><form id="sf">
