<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f6fa">
<title>مصنع AI — أنشئ تطبيقك بوصف عربي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6fa; --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8; --line:#e2e8f0;
  --sky:#0284c7; --sky-d:#0369a1; --sky-l:#38bdf8; --sky-soft:#e0f2fe; --white:#fff;
  --glass:rgba(255,255,255,.74); --danger:#dc2626; --danger-soft:#fee2e2; --ok:#15803d; --ok-soft:#dcfce7; --warn-soft:#fef3c7;
  --r-card:22px; --r-ctl:14px; --r-sm:10px;
  --font:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:var(--font);color:var(--ink);line-height:1.7;min-height:100vh;
  background:
    radial-gradient(900px 500px at 85% -10%,rgba(56,189,248,.22),transparent 60%),
    radial-gradient(700px 480px at 0% 30%,rgba(148,163,184,.18),transparent 60%),
    var(--bg);
  background-attachment:fixed;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky-l);outline-offset:2px}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:rgba(243,246,250,.8);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-in{max-width:1200px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;text-decoration:none;color:var(--ink);white-space:nowrap}
.logo-mark{width:36px;height:36px;border-radius:11px;background:var(--sky);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700}
.nav{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.nav a,.nav button{white-space:nowrap;border:0;background:transparent;padding:8px 12px;border-radius:var(--r-sm);text-decoration:none;color:var(--ink2);font-weight:500;font-size:15px;transition:background .15s,color .15s}
.nav a:hover,.nav button:hover{background:var(--sky-soft);color:var(--sky-d)}
.nav a.on{background:var(--sky-soft);color:var(--sky-d)}

main{max-width:1200px;margin:auto;padding:20px 16px 40px}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 10px 30px -12px rgba(2,132,199,.18);border-radius:var(--r-card)}

/* buttons */
.btn{text-decoration:none;color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--white);padding:10px 16px;border-radius:var(--r-ctl);font-weight:600;font-size:15px;transition:transform .12s,background .15s,border-color .15s}
.btn:hover{border-color:var(--sky-l);background:#f8fcff}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--sky);border-color:var(--sky);color:#fff}
.btn.go{white-space:normal}
.btn.primary:hover{background:var(--sky-d)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}

/* home */
.hero{max-width:780px;margin:18px auto 0}
.hero h1{font-size:clamp(28px,6vw,44px);line-height:1.35;margin:0 0 10px;font-weight:700;letter-spacing:-.2px}
.hero p.sub{margin:0 0 22px;color:var(--ink2);font-size:17px;max-width:60ch}
.idea{padding:14px;animation:rise .45s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.idea textarea{width:100%;min-height:170px;resize:vertical;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.9);padding:16px;font-size:17px;line-height:1.8;transition:border-color .15s,box-shadow .15s}
.idea textarea:focus{outline:none;border-color:var(--sky-l);box-shadow:0 0 0 4px rgba(56,189,248,.2)}
.idea-foot{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.count{color:var(--ink3);font-size:13px;margin-inline-start:auto;direction:ltr;unicode-bidi:isolate}
.go{width:100%;padding:15px 18px;font-size:clamp(15px,4.4vw,18px);margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.85);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--ink2);transition:background .15s,border-color .15s,color .15s}
.chip:hover{background:var(--sky-soft);border-color:var(--sky-l);color:var(--sky-d)}
.notice{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--warn-soft);color:#78350f;font-size:15px}
.notice.err{background:var(--danger-soft);color:#7f1d1d}
.notice.ok{background:var(--ok-soft);color:#14532d}

/* progress */
.progress{padding:16px;margin-top:14px}
.p-top{display:flex;align-items:center;gap:10px}
.p-stage{font-weight:600;flex:1}
.p-bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 8px}
.p-bar i{display:block;height:100%;width:35%;border-radius:99px;background:var(--sky-l);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{margin-inline-start:-35%}100%{margin-inline-start:100%}}
.p-meta{color:var(--ink3);font-size:13px}
.p-files{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.p-files li{background:var(--sky-soft);color:var(--sky-d);border-radius:8px;padding:2px 10px;font-size:13px;font-family:var(--mono);direction:ltr}

/* projects */
.page-title{font-size:26px;margin:6px 0 16px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pcard{padding:16px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,box-shadow .15s}
.pcard:hover{transform:translateY(-2px)}
.pcard h3{margin:0;font-size:18px;line-height:1.4}
.pcard small{color:var(--ink3)}
.pcard .row{display:flex;gap:8px;margin-top:10px}
.empty{padding:36px 18px;text-align:center;color:var(--ink2)}

/* workspace */
.wbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.wname{font-size:20px;font-weight:700;margin:0;flex:1;min-width:140px;border:0;background:transparent;text-align:start;padding:4px 6px;border-radius:8px}
.wname:hover{background:rgba(255,255,255,.7)}
.tabs{display:flex;gap:6px;margin-bottom:12px;padding:5px}
.tab{flex:1;border:0;background:transparent;padding:9px 8px;border-radius:12px;font-weight:600;color:var(--ink2);transition:background .15s,color .15s}
.tab.on{background:var(--white);color:var(--sky-d);box-shadow:0 2px 8px -2px rgba(2,132,199,.25)}
.work{display:grid;gap:14px}
.panel{display:none}
.work[data-tab=preview] #p-preview,.work[data-tab=files] #p-files,.work[data-tab=chat] #p-chat{display:block}
@media(min-width:960px){
  .work{grid-template-columns:380px 1fr;align-items:start}
  .tab[data-t=chat]{display:none}
  #p-chat{display:block!important;grid-column:1;grid-row:1}
  #p-preview,#p-files{grid-column:2;grid-row:1}
  .work[data-tab=chat] #p-preview{display:block}
}
.pv-tool{display:flex;gap:8px;align-items:center;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pv-tool select{flex:1;min-width:120px}
select,.inp{border:1px solid var(--line);background:#fff;border-radius:var(--r-sm);padding:8px 10px}
.frame-wrap{background:#fff;border-radius:0 0 var(--r-card) var(--r-card);overflow:hidden}
.frame-wrap iframe{display:block;width:100%;height:68vh;min-height:420px;border:0;background:#fff}
.pv-note{padding:8px 12px;font-size:13px;color:var(--ink3);border-top:1px solid var(--line)}
.pv-err{padding:10px 12px;background:var(--danger-soft);color:#7f1d1d;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pv-err span{flex:1;direction:ltr;text-align:left;font-family:var(--mono);font-size:12px;word-break:break-word}
.ed{width:100%;min-height:58vh;border:0;border-top:1px solid var(--line);padding:14px;font-family:var(--mono);font-size:13.5px;line-height:1.65;direction:ltr;text-align:left;background:#fbfdff;resize:vertical;border-radius:0 0 var(--r-card) var(--r-card);tab-size:2;white-space:pre}
.ed:focus{outline:none;box-shadow:inset 0 0 0 3px rgba(56,189,248,.25)}
.dirty{color:#b45309;font-size:13px;font-weight:600}

/* chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 230px);min-height:420px;max-height:760px}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:92%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-break:break-word;font-size:15px}
.bub.u{align-self:flex-start;background:var(--sky);color:#fff;border-end-start-radius:6px}
.bub.a{align-self:flex-end;background:#fff;border:1px solid var(--line);border-end-end-radius:6px}
.bub.e{align-self:stretch;max-width:100%;background:var(--danger-soft);color:#7f1d1d}
.bub.p{align-self:stretch;max-width:100%;background:transparent;padding:0}
.bub .progress{margin-top:0}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 8px}
.cin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:flex-end}
.cin textarea{flex:1;min-height:46px;max-height:140px;resize:none;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.cin textarea:focus{outline:none;border-color:var(--sky-l);box-shadow:0 0 0 3px rgba(56,189,248,.2)}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.35);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:16px}
.modal-box{max-height:90vh;overflow:auto;background:#fff;border-radius:var(--r-card);padding:20px;max-width:460px;width:100%;box-shadow:0 30px 60px -20px rgba(15,23,42,.4)}
.modal-box h3{margin:0 0 8px}
.modal-box .inp{width:100%;margin:10px 0}
.toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));inset-inline:16px;display:flex;flex-direction:column;gap:8px;align-items:center;z-index:60;pointer-events:none}
.toast{pointer-events:auto;background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:15px;max-width:520px;animation:rise .2s ease-out both}
.toast.err{background:#b91c1c}.toast.ok{background:#15803d}
.models{direction:ltr;text-align:left;font-family:var(--mono);font-size:12px;max-height:160px;overflow:auto;background:var(--bg);border-radius:10px;padding:8px;margin-top:8px}
.guide-step{display:flex;gap:12px;margin:14px 0;align-items:flex-start}
.guide-num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--sky);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.guide-step b{display:block;margin-bottom:2px}
.guide-step span{color:var(--ink2);font-size:14px;line-height:1.9}
.guide-step code{direction:ltr;unicode-bidi:isolate;font-family:var(--mono);background:var(--sky-soft);color:var(--sky-d);padding:1px 6px;border-radius:6px;font-size:13px}
.guide-tip{background:var(--warn-soft);color:#78350f;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.9;margin-top:10px}
footer{text-align:center;color:var(--ink3);font-size:13px;padding:10px 16px 24px}
@media(max-width:420px){.top-in{gap:4px;padding:8px 12px}.logo{font-size:17px;gap:8px}.logo-mark{width:32px;height:32px;font-size:18px}.nav{gap:0}.nav a,.nav button{padding:7px 8px;font-size:14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="logo" href="#/"><span class="logo-mark">م</span><span>مصنع AI</span></a>
  <nav class="nav">
    <a href="#/" id="nav-home">جديد</a>
    <a href="#/projects" id="nav-projects">مشاريعي</a>
    <button type="button" id="btn-health">الإعدادات</button>
  </nav>
</div></header>

<main>
  <section id="view-home">
    <div class="hero">
      <h1>اكتب فكرتك بالعربية،<br>ويبني الذكاء الاصطناعي مشروعك الحقيقي</h1>
      <p class="sub">صِف ما تريد: نظام، متجر، لعبة، موقع. ستحصل على ملفات فعلية تعاينها وتعدّلها وتصدّرها.</p>
      <div id="key-warn" class="notice hidden"></div>
      <div class="idea glass">
        <textarea id="idea" placeholder="مثال: أنشئ نظاماً لإدارة طلاب مدرسة وتسجيل الغيابات، مع تقرير شهري لكل طالب…" maxlength="4000"></textarea>
        <div class="chips" id="chips"></div>
        <div class="idea-foot"><span class="count" id="count">0 / 4000</span></div>
        <button type="button" class="btn primary go" id="go">أنشئ مشروعي بالذكاء الاصطناعي</button>
      </div>
      <div id="home-progress"></div>
      <div style="text-align:center;margin-top:16px"><button type="button" class="btn ghost sm" id="btn-guide-home">كيف أنشر مشروعي على GitHub؟</button></div>
    </div>
  </section>

  <section id="view-projects" class="hidden">
    <h2 class="page-title">مشاريعي السابقة</h2>
    <div id="plist" class="grid"></div>
  </section>

  <section id="view-work" class="hidden"></section>
</main>
<footer>مصنع AI — تطوير المهندس علي المعموري</footer>
<div class="toasts" id="toasts"></div>
<div id="modal-root"></div>

<script>
'use strict';
/* ═════════ أدوات ═════════ */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
function toast(msg, type) {
  const t = h('div', { class: 'toast ' + (type || '') }, msg);
  $('#toasts').append(t);
  setTimeout(() => t.remove(), type === 'err' ? 6000 : 3200);
}
function fmtDate(ts) {
  try { return new Date(ts).toLocaleString('ar-IQ', { dateStyle: 'medium', timeStyle: 'short' }); } catch { return ''; }
}
const state = { config: null, project: null, tab: 'preview', page: 'index.html', activeFile: null, dirty: false, busy: false, previewErr: null };

/* ═════════ نوافذ ═════════ */
function modal(content) {
  const box = h('div', { class: 'modal-box' }, content);
  const m = h('div', { class: 'modal' }, box);
  $('#modal-root').append(m);
  return { el: m, close: () => m.remove() };
}
/* ═════════ الإعدادات والتخزين المحلي (بدون خادم) ═════════ */
const LS = {
  get(k, d = '') { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch { /* ignore */ } },
  keys() { try { return Object.keys(localStorage); } catch { return []; } },
};
/* ═════ إعدادات صاحب المنصة: عدّلها أنت فقط، والمستخدمون لا يرونها ═════
   لتشغيل المنصة للمستخدمين بدون أي مفتاح: افتح الصفحة بإضافة  #/owner  لرابطها واتبع الشرح. */
const OWNER = {
  proxyUrl: '',    // رابط Cloudflare Worker (الطريقة الآمنة الموصى بها)
  geminiKey: 'AQ.Ab8RN6I80i1ypiL5KyE5ydUtTjsXSY5-nIxeWtQQybZGn2E4xw',   // بديل أسرع لكنه أقل أماناً: مفتاح Gemini يظهر لكل من يفحص الصفحة
  model: '',       // اختياري، يُستخدم مع geminiKey فقط
  dailyLimit: 10,  // عدد عمليات الإنشاء لكل مستخدم باليوم (0 = بلا حد)
};
const builtIn = () => !!(OWNER.proxyUrl || OWNER.geminiKey);
function checkDailyLimit() {
  if (!builtIn() || !OWNER.dailyLimit) return;
  const today = new Date().toISOString().slice(0, 10);
  let rec; try { rec = JSON.parse(LS.get('masna_day', '{}')); } catch { rec = {}; }
  if (rec.d !== today) rec = { d: today, n: 0 };
  if (rec.n >= OWNER.dailyLimit) throw new Error(`وصلت للحد اليومي (${OWNER.dailyLimit} عمليات). عُد غداً بإذن الله.`);
  rec.n++; LS.set('masna_day', JSON.stringify(rec));
}
const PROVIDERS = {
  gemini: { label: 'Google Gemini (مجاني)', short: 'Gemini', keyName: 'masna_key_gemini', modelName: 'masna_model_gemini', defModel: 'gemini-flash-latest', ph: 'AIza…' },
  anthropic: { label: 'Anthropic Claude (مدفوع)', short: 'Anthropic', keyName: 'masna_key', modelName: 'masna_model', defModel: 'claude-sonnet-5-5', ph: 'sk-ant-…' },
};
const cfg = {
  provider() { return LS.get('masna_provider') === 'anthropic' ? 'anthropic' : 'gemini'; },
  P() { return PROVIDERS[this.provider()]; },
  key() { return LS.get(this.P().keyName).trim(); },
  model() { return LS.get(this.P().modelName).trim() || this.P().defModel; },
};
const MAX_TOKENS = 32000, MAX_FILES = 40, MAX_FILE_CHARS = 400000, MAX_CONTEXT_CHARS = 250000;
const ALLOWED_EXT = new Set(['html', 'css', 'js', 'json', 'svg', 'txt', 'md']);
const PATH_RE = /^[\w\-.\u0600-\u06FF]+(\/[\w\-.\u0600-\u06FF]+)*$/;
function validPath(p) {
  if (typeof p !== 'string' || p.length > 100 || !PATH_RE.test(p)) return false;
  if (p.split('/').some(s => s === '..' || s === '.' || s.startsWith('.'))) return false;
  return p.includes('.') && ALLOWED_EXT.has(p.split('.').pop().toLowerCase());
}

/* ─── المشاريع (تُحفظ في متصفحك) ─── */
const PKEY = id => 'masna_p_' + id;
function loadProject(id) { try { const s = LS.get(PKEY(id), null); return s ? JSON.parse(s) : null; } catch { return null; } }
function saveProject(p) {
  p.updatedAt = Date.now();
  if (!LS.set(PKEY(p.id), JSON.stringify(p))) throw new Error('تعذّر الحفظ: مساحة تخزين المتصفح ممتلئة أو معطّلة. صدّر مشروعك بـ ZIP واحذف مشاريع قديمة.');
}
function listProjects() {
  const out = [];
  for (const k of LS.keys()) {
    if (!k.startsWith('masna_p_')) continue;
    const p = loadProject(k.slice(8));
    if (p && p.files) out.push({ id: p.id, name: p.name, fileCount: Object.keys(p.files).length, updatedAt: p.updatedAt });
  }
  return out.sort((a, b) => b.updatedAt - a.updatedAt);
}
function newProject(name) {
  const id = Array.from(crypto.getRandomValues(new Uint8Array(8)), b => b.toString(16).padStart(2, '0')).join('');
  return { id, name, files: {}, messages: [], createdAt: Date.now(), updatedAt: Date.now() };
}

/* نفس واجهة الخادم القديم لكن محلياً */
async function api(url, opt = {}) {
  const method = opt.method || 'GET', body = opt.body || {};
  const u = new URL(url, 'http://x'), p = u.pathname;
  if (p === '/api/projects' && method === 'GET') return { projects: listProjects() };
  const m = p.match(/^\/api\/projects\/([^/]+)(\/files)?$/);
  if (!m) throw new Error('طلب غير معروف.');
  const project = loadProject(m[1]);
  if (!project) throw new Error('المشروع غير موجود.');
  if (!m[2]) {
    if (method === 'GET') return { project };
    if (method === 'PATCH') {
      const name = String(body.name || '').trim().slice(0, 60);
      if (!name) throw new Error('الاسم فارغ.');
      project.name = name; saveProject(project); return { name };
    }
    if (method === 'DELETE') { LS.del(PKEY(project.id)); return { ok: true }; }
  } else {
    if (method === 'PUT') {
      if (!validPath(body.path)) throw new Error('اسم الملف غير صالح. استخدم حروفاً وأرقاماً وامتداداً مثل .html أو .css أو .js');
      const content = typeof body.content === 'string' ? body.content : '';
      if (content.length > MAX_FILE_CHARS) throw new Error('الملف كبير جداً.');
      if (!(body.path in project.files) && Object.keys(project.files).length >= MAX_FILES) throw new Error('وصلت للحد الأقصى من الملفات.');
      project.files[body.path] = content; saveProject(project); return { ok: true };
    }
    if (method === 'DELETE') {
      const f = u.searchParams.get('path');
      if (f === 'index.html') throw new Error('لا يمكن حذف index.html');
      delete project.files[f]; saveProject(project); return { ok: true };
    }
  }
  throw new Error('طلب غير معروف.');
}

  'anthropic-dangerous-direct-browser-access': 'true',

async function apiError(r) {
  let detail = '';
  try { const j = await r.json(); detail = (j.error && j.error.message) || ''; } catch { /* ignore */ }
  const s = r.status;
  let msg;
  if (s === 401) msg = 'مفتاح Anthropic غير صحيح. راجع «الإعدادات».';
  else if (s === 403) msg = 'المفتاح لا يملك صلاحية استخدام هذه الخدمة.';
  else if (s === 404) msg = `النموذج «${cfg.model()}» غير متاح لحسابك. غيّره من «الإعدادات».`;
  else if (s === 400 && /credit|balance/i.test(detail)) msg = 'رصيد حسابك في Anthropic انتهى. اشحنه من console.anthropic.com ← Plans & Billing.';
  else if (s === 429) msg = 'تجاوزت حد الطلبات لدى Anthropic. انتظر دقيقة وأعد المحاولة.';

  else msg = 'رفض Anthropic الطلب' + (detail ? ': ' + detail : '.');

const SYSTEM = `You are the code-generation engine of "مصنع AI", an Arabic platform that turns a user's description into a real, working front-end project.

PROJECT RULES
- Output a static project that runs by opening index.html in a browser: HTML + CSS + vanilla JavaScript. No build step, no frameworks, no npm, no backend, no API calls, no external CDN libraries, no remote images. Use inline SVG or emoji for icons and graphics. Google Fonts are allowed.
- Default to Arabic UI with <html lang="ar" dir="rtl">, mobile-first responsive layout, readable modern design, good contrast, large touch targets. Use another language only if the user asks.
- Persist user data with localStorage (wrapped in try/catch). Seed realistic sample data when it makes the first screen useful.
- Everything must really work: every button, form, filter and calculation. No placeholders, no "TODO", no "add your code here". Handle empty states and invalid input.
- Typical layout: index.html, style.css, script.js. Extra pages (e.g. about.html) are fine; link them with relative paths like href="about.html". Keep files focused. Only use these extensions: html, css, js, json, svg, txt, md.
- Escape any user-entered text before inserting it into the DOM (use textContent or an escape helper).

OUTPUT FORMAT (strict, nothing outside these blocks except what is described)
Each file, written IN FULL (never partial, never diffs):
===FILE: path/name.ext===
<raw file content, no markdown code fences>
===END===

For a NEW project, first line must be: ===NAME: <short Arabic project name, max 40 chars>===
Then all files. Then a short Arabic summary (2-4 sentences, what was built and how to use it):
===SUMMARY===
<text>
===END===

FOR EDIT REQUESTS you receive the current files. Return ONLY files that changed or are new, each in full. To remove a file write: ===DELETE: path===
Keep everything the user did not ask to change. Finish with ===SUMMARY=== describing what changed.

If the user only asks a question or the request needs no file changes, answer in Arabic using:
===MESSAGE===
<answer>
===END===
and output no files.`;

function unfence(s) { const m = s.match(/^```[\w-]*\r?\n([\s\S]*?)\r?\n```\s*$/); return m ? m[1] : s; }
function parseOutput(text) {
  const files = {}; let count = 0, m;
  const fileRe = /^===FILE:[ \t]*(.+?)[ \t]*===[ \t]*\r?\n([\s\S]*?)\r?\n?^===END===[ \t]*$/gm;
  while ((m = fileRe.exec(text))) { files[m[1].trim()] = unfence(m[2]); count++; }
  const started = (text.match(/^===FILE:/gm) || []).length;
  const deletes = [];
  const delRe = /^===DELETE:[ \t]*(.+?)[ \t]*===[ \t]*$/gm;
  while ((m = delRe.exec(text))) deletes.push(m[1].trim());
  const name = (text.match(/^===NAME:[ \t]*(.+?)[ \t]*===[ \t]*$/m) || [])[1] || null;
  const summary = (text.match(/^===SUMMARY===[ \t]*\r?\n([\s\S]*?)\r?\n?(?:^===END===|$(?![\s\S]))/m) || [])[1] || null;
  const message = (text.match(/^===MESSAGE===[ \t]*\r?\n([\s\S]*?)\r?\n?(?:^===END===|$(?![\s\S]))/m) || [])[1] || null;
  return { files, deletes, name, summary: summary && summary.trim(), message: message && message.trim(), unfinished: started > count };
}
function buildUserContent(prompt, project) {
  if (!project) return prompt;
  const parts = ['CURRENT PROJECT FILES:'];
  for (const [p, c] of Object.entries(project.files)) parts.push(`===FILE: ${p}===\n${c}\n===END===`);
  const hist = (project.messages || []).slice(-6).map(x => `${x.role === 'user' ? 'USER' : 'ASSISTANT'}: ${String(x.text).slice(0, 600)}`);
  if (hist.length) parts.push('RECENT CONVERSATION:\n' + hist.join('\n'));
  parts.push('USER REQUEST (apply it to the project above):\n' + prompt);
  return parts.join('\n\n');
}

async function geminiError(r) {
  let detail = '';
  try { const j = await r.json(); detail = (j.error && j.error.message) || ''; } catch { /* ignore */ }
  const s = r.status;
  if (builtIn()) {
    if (s === 429) return new Error('وصلت المنصة لحد الاستخدام المجاني حالياً. حاول بعد دقائق أو غداً.');
    if (s === 400 || s === 403 || s === 404) return new Error('تعذّر الإنشاء بسبب إعداد المنصة، أبلغ صاحبها.' + (detail ? ' (' + detail.slice(0, 120) + ')' : ''));
  }
  if (/location|region|not supported/i.test(detail)) return new Error('خدمة Gemini غير متاحة في منطقتك حالياً: ' + detail);
  if (s === 400 && /api key|API_KEY/i.test(detail)) return new Error('مفتاح Gemini غير صحيح. أنشئ مفتاحاً جديداً من aistudio.google.com/apikey وألصقه في «الإعدادات».');
  if (s === 403) return new Error('رفض Gemini المفتاح أو الخدمة غير متاحة لحسابك' + (detail ? ': ' + detail : '.'));
  if (s === 404) return new Error(`النموذج «${cfg.model()}» غير متاح. غيّره من «الإعدادات» (اتركه فارغاً للافتراضي).`);
  if (s === 429) return new Error('وصلت لحد الاستخدام المجاني (طلبات بالدقيقة أو باليوم). انتظر دقيقة وأعد المحاولة، وإن تكرر فجرّب غداً.');
  if (s >= 500) return new Error('خوادم Gemini مشغولة الآن. أعد المحاولة بعد قليل.');
  return new Error('رفض Gemini الطلب' + (detail ? ': ' + detail : '.'));
}

async function readSse(r, onEvent) {
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true }).replace(/\r\n/g, '\n');
    let i;
    while ((i = buf.indexOf('\n\n')) !== -1) {
      const block = buf.slice(0, i); buf = buf.slice(i + 2);
      const line = block.split('\n').find(l => l.startsWith('data:'));
      if (!line) continue;
      let ev; try { ev = JSON.parse(line.slice(5)); } catch { continue; }
      onEvent(ev);
    }
  }
}

async function streamGemini(user, signal, onDelta) {
  let url, payload;
  const headers = { 'content-type': 'application/json' };
  if (OWNER.proxyUrl) { url = OWNER.proxyUrl; payload = { system: SYSTEM, user }; }
  else {
    const model = OWNER.geminiKey ? (OWNER.model || PROVIDERS.gemini.defModel) : cfg.model();
    url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse`;
    headers['x-goog-api-key'] = OWNER.geminiKey || cfg.key();
    payload = { systemInstruction: { parts: [{ text: SYSTEM }] }, contents: [{ role: 'user', parts: [{ text: user }] }], generationConfig: { maxOutputTokens: 32768 } };
  }
  let r;
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      r = await fetch(url, { method: 'POST', signal, headers, body: JSON.stringify(payload) });
    } catch (e) { if (e.name === 'AbortError') throw e; throw new Error('تعذّر الاتصال بـ Gemini. تحقق من الإنترنت.'); }
    if (r.ok) break;
    if (attempt === 0 && r.status >= 500) { await new Promise(res => setTimeout(res, 2500)); continue; }
    break;
  }
  if (!r.ok) throw await geminiError(r);
  let fin = null;
  await readSse(r, ev => {
    if (ev.error) throw new Error('انقطع الإنشاء من جهة Gemini: ' + (ev.error.message || 'خطأ غير معروف'));
    if (ev.promptFeedback && ev.promptFeedback.blockReason) throw new Error('رفض Gemini الطلب لأسباب أمان (' + ev.promptFeedback.blockReason + '). أعد صياغة الفكرة.');
    const c = ev.candidates && ev.candidates[0];
    if (!c) return;
    for (const part of (c.content && c.content.parts) || []) if (part.text && !part.thought) onDelta(part.text);
    if (c.finishReason && c.finishReason !== 'STOP') fin = c.finishReason;
  });
  return fin === 'MAX_TOKENS' ? 'max_tokens' : null;
}

async function streamAnthropic(user, signal, onDelta) {
  let r;
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      r = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST', signal, headers: apiHeaders(cfg.key()),
        body: JSON.stringify({ model: cfg.model(), max_tokens: MAX_TOKENS, stream: true, system: SYSTEM, messages: [{ role: 'user', content: user }] }),
      });
    } catch (e) { if (e.name === 'AbortError') throw e; throw new Error('تعذّر الاتصال بـ Anthropic. تحقق من الإنترنت.'); }
    if (r.ok) break;
    if (attempt === 0 && (r.status === 429 || r.status === 529 || r.status >= 500)) { await new Promise(res => setTimeout(res, 2500)); continue; }
    break;
  }
  if (!r.ok) throw await apiError(r);
  let stop = null;
  await readSse(r, ev => {
    if (ev.type === 'content_block_delta' && ev.delta && ev.delta.type === 'text_delta') onDelta(ev.delta.text);
    else if (ev.type === 'message_delta' && ev.delta && ev.delta.stop_reason) stop = ev.delta.stop_reason;
    else if (ev.type === 'error') throw new Error('انقطع الإنشاء من جهة Anthropic: ' + ((ev.error && ev.error.message) || 'خطأ غير معروف'));
  });
  return stop;
}

async function streamGenerate(prompt, projectId, onEvent, signal) {
  if (!builtIn() && !cfg.key()) { openSettings(); throw new Error('أضف مفتاح ' + cfg.P().short + ' من «الإعدادات» أولاً.'); }
  let project = null;
  if (projectId) {
    project = loadProject(projectId);
    if (!project) throw new Error('المشروع غير موجود.');
    if (Object.values(project.files).reduce((n, c) => n + c.length, 0) > MAX_CONTEXT_CHARS) throw new Error('المشروع كبير جداً للتعديل بالمحادثة. عدّل الملفات يدوياً من تبويب الملفات.');
  }
  checkDailyLimit();
  let full = '', scanFrom = 0, lastTick = 0;
  const seen = new Set();
  const headerRe = /^===FILE:[ \t]*(.+?)[ \t]*===/gm;
  const scan = () => {
    headerRe.lastIndex = scanFrom; let m;
    while ((m = headerRe.exec(full))) { scanFrom = headerRe.lastIndex; const p = m[1].trim(); if (!seen.has(p)) { seen.add(p); onEvent({ type: 'file', path: p }); } }
    onEvent({ type: 'progress', chars: full.length });
  };
  const user = buildUserContent(prompt, project);
  const onDelta = t => { full += t; const now = Date.now(); if (now - lastTick > 250) { lastTick = now; scan(); } };
  const stop = await ((builtIn() || cfg.provider() === 'gemini') ? streamGemini(user, signal, onDelta) : streamAnthropic(user, signal, onDelta));
  scan();

  const out = parseOutput(full), notes = [];
  if (!Object.keys(out.files).length && !out.deletes.length) {
    if (project && (out.message || out.summary || full.trim())) {
      const text = out.message || out.summary || full.trim().slice(0, 2000);
      project.messages.push({ role: 'user', text: prompt }, { role: 'assistant', text });
      saveProject(project);
      onEvent({ type: 'message', summary: text });
    } else onEvent({ type: 'error', message: out.unfinished ? 'انقطع الناتج لأن المشروع طويل جداً. جرّب فكرة أبسط أو قسّمها إلى خطوات.' : 'لم يُنتج النموذج أي ملفات. أعد صياغة الفكرة وحاول مرة أخرى.' });
    return;
  }
  const isNew = !project;
  if (isNew) project = newProject((out.name || prompt).replace(/\s+/g, ' ').slice(0, 40));
  for (const [p, c] of Object.entries(out.files)) {
    if (!validPath(p)) { notes.push(`تم تجاهل ملف باسم غير صالح: ${p}`); continue; }
    if (c.length > MAX_FILE_CHARS) { notes.push(`تم تجاهل ${p} لأنه كبير جداً.`); continue; }
    if (!(p in project.files) && Object.keys(project.files).length >= MAX_FILES) { notes.push(`تم تجاهل ${p}: وصلت للحد الأقصى من الملفات.`); continue; }
    project.files[p] = c;
  }
  for (const p of out.deletes) if (p !== 'index.html') delete project.files[p];
  if (out.unfinished || stop === 'max_tokens') notes.push('الناتج كان طويلاً وانقطع جزء منه؛ طُبّقت الملفات المكتملة فقط. اكتب في المحادثة «أكمل ما تبقى من المشروع» ليكمله الذكاء الاصطناعي.');
  if (isNew && !project.files['index.html']) { onEvent({ type: 'error', message: 'لم يُنتج ملف index.html الأساسي (غالباً بسبب طول المشروع). جرّب فكرة أبسط.' }); return; }
  const changed = Object.keys(out.files).filter(p => p in project.files);
  const summary = out.summary || (changed.length ? 'تم تحديث: ' + changed.join('، ') : 'تم التعديل.');
  project.messages.push({ role: 'user', text: prompt }, { role: 'assistant', text: summary });
  if (project.messages.length > 40) project.messages = project.messages.slice(-40);
  saveProject(project);
  onEvent({ type: 'done', project, notes });
}

function progressView() {

  }, 500);

    chars(n) { chars = n; },
    saving() { stage.textContent = 'جاري الحفظ…'; },
    stop() { clearInterval(tick); },
  };
}

async function runJob(prompt, projectId, pv) {
  const ctrl = new AbortController();
  pv.onCancel(() => ctrl.abort());
  let result = null, error = null;
  try {
    await streamGenerate(prompt, projectId, ev => {
      if (ev.type === 'file') pv.file(ev.path);
      else if (ev.type === 'progress') pv.chars(ev.chars);
      else if (ev.type === 'done') { pv.saving(); result = ev; }
      else if (ev.type === 'message') result = ev;
      else if (ev.type === 'error') error = ev.message;
    }, ctrl.signal);
  } catch (e) { error = e.name === 'AbortError' ? 'تم إلغاء العملية.' : e.message; }
  pv.stop();
  if (!result && !error) error = 'انقطع الاتصال بالخادم قبل اكتمال الإنشاء. أعد المحاولة.';
  return { result, error };
}

function applyProject(p) {

const PREVIEW_SHIM = `<script>(function(){

if(/^[^:#?]+\\.html([#?].*)?$/.test(h)){e.preventDefault();parent.postMessage({masna:'nav',href:h},'*')}

function resolvePath(href, fromPage) {
  try { return decodeURIComponent(new URL(href.split('#')[0].split('?')[0], 'http://p.local/' + fromPage).pathname.slice(1)); } catch { return null; }
}

function buildPreview(files, page) {
  let html = files[page];
  if (html == null) return '<!doctype html><meta charset="utf-8"><body dir="rtl" style="font-family:sans-serif;padding:24px;color:#475569">لا يوجد ملف HTML للمعاينة.</body>';
  const local = href => (/^([a-z]+:)?\/\//i.test(href) || /^(data|blob|mailto|tel):/i.test(href)) ? null : resolvePath(href, page);
  html = html.replace(/<link\b[^>]*>/gi, tag => {
    if (!/rel\s*=\s*["']?stylesheet/i.test(tag)) return tag;
    const m = tag.match(/href\s*=\s*["']([^"']+)["']/i); if (!m) return tag;
    const p = local(m[1]);
    return p && files[p] !== undefined ? '<style>' + files[p].replace(/<\/style/gi, '<\\/style') + '</style>' : tag;
  });
  html = html.replace(/<script\b([^>]*?)\bsrc\s*=\s*["']([^"']+)["']([^>]*)>\s*<\/script>/gi, (all, a, src, b) => {
    const p = local(src);
    return p && files[p] !== undefined ? `<script${a}${b}>` + files[p].replace(/<\/script/gi, '<\\/script') + '<\/script>' : all;
  });
  html = html.replace(/(<img\b[^>]*?\bsrc\s*=\s*)(["'])([^"']+\.svg)\2/gi, (all, pre, q, src) => {
    const p = local(src);
    return p && files[p] !== undefined ? `${pre}"data:image/svg+xml;charset=utf-8,${encodeURIComponent(files[p])}"` : all;
  });
  if (/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i, m => m + PREVIEW_SHIM);
  if (/<html[^>]*>/i.test(html)) return html.replace(/<html[^>]*>/i, m => m + '<head>' + PREVIEW_SHIM + '</head>');
  return PREVIEW_SHIM + html;
}

async function sendChat(text) {
  if (state.busy) { toast('انتظر انتهاء العملية الحالية.', 'err'); return; }
  text = String(text).trim();
  if (text.length < 4) { toast('اكتب طلباً أوضح.', 'err'); return; }
  if (state.dirty && !confirm('لديك تعديلات غير محفوظة في المحرر وستضيع إذا تابعت. متابعة؟')) return;

  ui.msgs.append(h('div', { class: 'bub u' }, text));

  ui.msgs.scrollTop = ui.msgs.scrollHeight;

  if (error) {

    ui.msgs.append(h('div', { class: 'bub a' }, result.summary));
  } else {
    const keepTab = state.tab;
    applyProject(result.project);
    refreshPreview(); refreshEditor(); renderChat();
    (result.notes || []).forEach(n => toast(n, 'err'));
    toast('تم تطبيق التعديل', 'ok');
    if (!isDesktop() && keepTab === 'chat') { /* يبقى في المحادثة ليقرأ الملخص */ }
  }
  ui.msgs.scrollTop = ui.msgs.scrollHeight;
}

/* ═════════ تصدير ZIP (بدون مكتبات) ═════════ */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    const nb = enc.encode(name), data = typeof content === 'string' ? enc.encode(content) : content, crc = crc32(data);

    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, nb.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), nb, data);

    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, nb.length, true);
    ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), nb);

}
function exportZip() {
  const files = state.project.files;

  const blob = makeZip(files);

      + "self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==CACHE).map(x=>caches.delete(x)))).then(()=>self.clients.claim()))});\n"
      + "self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>caches.match('./index.html'))))});\n";
    out['icon-192.png'] = await drawIcon(192, name, false);

      '   سينزّل لك ملف ZIP فيه APK يمكن تثبيته مباشرة.', '',
      'ملاحظات:',
      '- التثبيت المباشر على الجوال من دون APK ممكن أيضاً: من كروم ← ⋮ ← «تثبيت التطبيق».',
      '- لنشر التطبيق على Google Play ستحتاج حساب مطوّر، وتوقيع التطبيق، وسياسة خصوصية.',

      h('div', { class: 'p-meta', style: 'line-height:2' }, '٣) نزّل الـ APK وثبّته. أو ثبّت التطبيق مباشرة من كروم ← ⋮ ← «تثبيت التطبيق» بدون APK.'),

/* ═════════ دليل صاحب المنصة: مستخدمون بدون مفتاح ═════════ */
const WORKER_CODE = `export default {
  async fetch(request, env) {
    const origin = request.headers.get('Origin') || '';
    const allowed = String(env.ALLOWED_ORIGINS || '*').split(',').map(function (s) { return s.trim(); });
    const okOrigin = allowed.indexOf('*') !== -1 || allowed.indexOf(origin) !== -1;
    const cors = {
      'Access-Control-Allow-Origin': okOrigin ? (origin || '*') : 'null',
      'Access-Control-Allow-Methods': 'POST, OPTIONS',
      'Access-Control-Allow-Headers': 'content-type',
      'Access-Control-Max-Age': '86400',
      'Vary': 'Origin'
    };
    const fail = function (status, message) {
      return new Response(JSON.stringify({ error: { message: message } }), {
        status: status,
        headers: Object.assign({ 'Content-Type': 'application/json' }, cors)
      });
    };
    if (request.method === 'OPTIONS') return new Response(null, { status: 204, headers: cors });
    if (request.method !== 'POST') return fail(405, 'method not allowed');
    if (!okOrigin) return fail(403, 'origin not allowed');
    if (!env.GEMINI_KEY) return fail(500, 'GEMINI_KEY is not set');
    let body;
    try { body = await request.json(); } catch (e) { return fail(400, 'bad json'); }
    const system = String(body.system || '').slice(0, 20000);
    const user = String(body.user || '');
    if (user.length < 4 || user.length > 300000) return fail(413, 'bad size');
    const model = env.MODEL || 'gemini-flash-latest';
    const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + model + ':streamGenerateContent?alt=sse';
    const upstream = await fetch(url, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-goog-api-key': env.GEMINI_KEY },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: system }] },
        contents: [{ role: 'user', parts: [{ text: user }] }],
        generationConfig: { maxOutputTokens: 32768 }
      })
    });
    return new Response(upstream.body, {
      status: upstream.status,
      headers: Object.assign({
        'Content-Type': upstream.headers.get('content-type') || 'text/event-stream',
        'Cache-Control': 'no-store'
      }, cors)
    });
  }
};
`;
function copyText(t) {
  const done = () => toast('تم النسخ', 'ok');
  const fallback = () => {
    const ta = h('textarea', { style: 'position:fixed;opacity:0' }); ta.value = t; document.body.append(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch { toast('تعذّر النسخ، حدّد النص يدوياً.', 'err'); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fallback); else fallback();
}
let ownerOpen = false;

  if (ownerOpen) return;
  ownerOpen = true;
  const step = (n, t, d) => h('div', { class: 'guide-step' }, h('div', { class: 'guide-num' }, String(n)), h('div', null, h('b', null, t), h('span', null, d)));
  const m = modal([

    h('div', { class: 'p-meta' }, 'الفكرة: مفتاحك يبقى سرياً داخل «وسيط» مجاني على Cloudflare، والصفحة تتصل بالوسيط بدل أن تحمل المفتاح. المستخدم يدخل ويكتب فكرته مباشرة.'),
    step(1, 'أنشئ مفتاح Gemini المجاني', ['من ', h('code', null, 'aistudio.google.com/apikey'), ' واضغط Create API key، وانسخه.']),
    step(2, 'أنشئ الوسيط على Cloudflare', ['سجّل مجاناً في ', h('code', null, 'dash.cloudflare.com'), ' ثم Workers & Pages ← Create ← Create Worker، سمّه مثل masna-proxy واضغط Deploy، ثم Edit code واحذف كل ما فيه والصق الكود أدناه، ثم Deploy.']),
    h('pre', { style: 'direction:ltr;text-align:left;background:var(--bg);padding:10px;border-radius:10px;overflow:auto;max-height:200px;font-size:12px;font-family:var(--mono);white-space:pre;margin:6px 0' }, WORKER_CODE),
    h('button', { class: 'btn sm', type: 'button', onclick: () => copyText(WORKER_CODE) }, 'نسخ كود الوسيط'),
    step(3, 'أضف المفتاح للوسيط', ['في صفحة الـ Worker: Settings ← Variables and Secrets ← Add. أضف متغيراً من نوع Secret اسمه ', h('code', null, 'GEMINI_KEY'), ' وقيمته مفتاحك. وأضف متغيراً نصياً ', h('code', null, 'ALLOWED_ORIGINS'), ' قيمته رابط موقعك مثل ', h('code', null, 'https://اسمك.github.io'), ' (بدون / في النهاية) حتى لا تعمل إلا من موقعك. ثم Deploy.']),
    step(4, 'انسخ رابط الوسيط', ['ينتهي بـ ', h('code', null, 'workers.dev'), ' ويظهر أعلى صفحة الـ Worker.']),
    step(5, 'ضع الرابط في index.html', ['افتح الملف في مستودعك على GitHub واضغط أيقونة القلم، وابحث عن ', h('code', null, "proxyUrl: ''"), ' وضع الرابط بين علامتي الاقتباس، ثم Commit changes. بعد دقيقة يعمل الموقع بدون مفتاح عند المستخدمين.']),
    h('div', { class: 'guide-tip' }, 'الحد المجاني لـ Gemini مشترك بين كل مستخدميك. تحكّم بعدد العمليات لكل مستخدم من dailyLimit في نفس الملف (الافتراضي 10 باليوم)، وإذا استُهلك الحد تظهر للمستخدم رسالة لطيفة.'),
    h('div', { class: 'guide-tip' }, 'بديل أسرع وأقل أماناً: ضع مفتاح Gemini مباشرة في geminiKey. لكنه سيظهر لأي شخص يفحص الصفحة. إن فعلت، قيّد المفتاح بموقعك من Google AI Studio أو Google Cloud (قيود HTTP referrers).'),
    h('button', { class: 'btn primary', type: 'button', style: 'margin-top:12px', onclick: () => { m.close(); ownerOpen = false; } }, 'تمام'),
  ]);
}

/* ═════════ الإعدادات واختبار الاتصال ═════════ */
function updateKeyWarn() {
  const w = $('#key-warn');
  if (builtIn() || cfg.key()) { w.classList.add('hidden'); return; }
  w.classList.remove('hidden');
  w.textContent = 'لم تضف مفتاح ' + cfg.P().short + ' بعد. اضغط هنا (أو «الإعدادات» بالأعلى) لإضافته، وبدونه لا يعمل الإنشاء.';
  w.style.cursor = 'pointer';
  w.onclick = () => openSettings();
}
async function testConnection(out) {
  out.className = 'p-meta'; out.replaceChildren('جاري الاختبار الفعلي…');
  const model = cfg.model(), key = cfg.key(), gem = cfg.provider() === 'gemini';
  let models = [];
  try {
    let t, err;
    if (gem) {
      const base = 'https://generativelanguage.googleapis.com/v1beta/models';
      const m = await fetch(base + '?pageSize=200', { headers: { 'x-goog-api-key': key } });
      if (!m.ok) throw await geminiError(m);
      models = ((await m.json()).models || []).filter(x => (x.supportedGenerationMethods || []).includes('generateContent')).map(x => x.name.replace(/^models\//, ''));
      t = await fetch(`${base}/${encodeURIComponent(model)}:generateContent`, { method: 'POST', headers: { 'content-type': 'application/json', 'x-goog-api-key': key }, body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: 'ping' }] }], generationConfig: { maxOutputTokens: 16 } }) });
      if (!t.ok) err = await geminiError(t);
    } else {
      const m = await fetch('https://api.anthropic.com/v1/models?limit=100', { headers: apiHeaders(key) });
      if (m.ok) models = ((await m.json()).data || []).map(x => x.id);
      else if (m.status === 401) throw await apiError(m);
      t = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: apiHeaders(key), body: JSON.stringify({ model, max_tokens: 16, messages: [{ role: 'user', content: 'ping' }] }) });
      if (!t.ok) err = await apiError(t);
    }
    if (!err) { out.className = 'notice ok'; out.replaceChildren(`الاتصال سليم ✓ المزوّد: ${cfg.P().short} | النموذج: ${model}`); }
    else { out.className = 'notice ' + (t.status === 404 ? '' : 'err'); out.replaceChildren(err.message); }
  } catch (e) {
    out.className = 'notice err';
    out.replaceChildren(e instanceof TypeError ? 'تعذّر الوصول إلى الخدمة. تحقق من الإنترنت.' : e.message);
  }
  if (models.length) out.append(h('div', { class: 'models' }, models.join('\n')));
}
let settingsOpen = false;
function openSettings() {
  if (settingsOpen) return;
  settingsOpen = true;
  const sel = h('select', { class: 'inp', 'aria-label': 'المزوّد' }, ...Object.entries(PROVIDERS).map(([id, P]) => h('option', { value: id, selected: id === cfg.provider() }, P.label)));
  const keyLabel = h('label', { class: 'p-meta' });
  const keyInp = h('input', { class: 'inp', type: 'password', autocomplete: 'off', spellcheck: 'false', style: 'direction:ltr;text-align:left' });
  const modelInp = h('input', { class: 'inp', type: 'text', autocomplete: 'off', spellcheck: 'false', style: 'direction:ltr;text-align:left' });
  const help = h('div', { class: 'p-meta', style: 'line-height:1.9' });
  const out = h('div', { class: 'p-meta' });
  const fill = () => {
    const P = PROVIDERS[sel.value];
    keyInp.value = LS.get(P.keyName); modelInp.value = LS.get(P.modelName);
    keyInp.placeholder = P.ph; modelInp.placeholder = P.defModel;
    keyLabel.textContent = 'مفتاح ' + P.short;
    help.textContent = sel.value === 'gemini'
      ? 'مجاني بدون بطاقة: ادخل aistudio.google.com/apikey وسجّل بحساب Google واضغط Create API key. للاستخدام المجاني حدود على عدد الطلبات بالدقيقة واليوم، وقد تستخدم Google ما ترسله لتحسين منتجاتها، فلا تكتب بيانات سرية.'
      : 'مدفوع: أنشئ مفتاحاً من console.anthropic.com ← API Keys، واشحن رصيداً من Plans & Billing.';
    out.replaceChildren(); out.className = 'p-meta';
  };
  sel.addEventListener('change', fill); fill();
  const persist = () => {
    const P = PROVIDERS[sel.value];
    const ok = LS.set('masna_provider', sel.value) && LS.set(P.keyName, keyInp.value.trim()) && LS.set(P.modelName, modelInp.value.trim());
    if (!ok) { toast('تعذّر الحفظ: التخزين المحلي معطّل في متصفحك.', 'err'); return false; }
    updateKeyWarn(); return true;
  };
  const m = modal([
    h('h3', null, 'الإعدادات'),
    h('label', { class: 'p-meta' }, 'مزوّد الذكاء الاصطناعي'), sel,
    keyLabel, keyInp,
    h('button', { class: 'btn ghost sm', type: 'button', onclick: e => { const s2 = keyInp.type === 'password'; keyInp.type = s2 ? 'text' : 'password'; e.target.textContent = s2 ? 'إخفاء المفتاح' : 'إظهار المفتاح'; } }, 'إظهار المفتاح'),
    h('label', { class: 'p-meta' }, 'النموذج (اتركه فارغاً للافتراضي)'), modelInp,
    help,
    h('div', { class: 'p-meta' }, 'يُحفظ المفتاح على هذا الجهاز فقط ويُرسل مباشرة إلى المزوّد. لا تستخدم هذه الصفحة على جهاز لا تثق به، ولا تشارك نسخة تحتوي مفتاحك.'),
    h('button', { class: 'btn ghost sm', type: 'button', onclick: () => { m.close(); settingsOpen = false; showOwnerGuide(); } }, 'أنا صاحب المنصة: أريد المستخدمين بدون مفتاح'),
    out,
    h('div', { style: 'display:flex;gap:8px;margin-top:12px;flex-wrap:wrap' },
      h('button', { class: 'btn primary', type: 'button', onclick: () => { if (persist()) toast('تم حفظ الإعدادات', 'ok'); } }, 'حفظ'),
      h('button', { class: 'btn', type: 'button', onclick: () => { if (!keyInp.value.trim()) { out.className = 'notice err'; out.replaceChildren('أدخل المفتاح أولاً.'); return; } if (persist()) testConnection(out); } }, 'حفظ واختبار الاتصال'),
      h('button', { class: 'btn ghost', type: 'button', onclick: () => { m.close(); settingsOpen = false; } }, 'إغلاق')),
  ]);
}
$('#btn-health').addEventListener('click', openSettings);
$('#btn-guide-home').addEventListener('click', showPublishGuide);
