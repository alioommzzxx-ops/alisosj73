<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='22' fill='%230f766e'/%3E%3Cg fill='%23fff'%3E%3Crect x='20' y='20' width='22' height='22' rx='4'/%3E%3Crect x='54' y='20' width='22' height='22' rx='4'/%3E%3Crect x='20' y='54' width='22' height='22' rx='4'/%3E%3Crect x='54' y='54' width='9' height='9'/%3E%3Crect x='67' y='67' width='9' height='9'/%3E%3Crect x='67' y='54' width='9' height='9'/%3E%3C/g%3E%3Cg fill='%230f766e'%3E%3Crect x='26' y='26' width='10' height='10'/%3E%3Crect x='60' y='26' width='10' height='10'/%3E%3Crect x='26' y='60' width='10' height='10'/%3E%3C/g%3E%3C/svg%3E">
<title>نظام الحضور والغيابات — إعدادية النهرين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  color-scheme:light;
  --blue:#0f766e; --blue-d:#0a3f3b; --blue-m:#2bb3a3; --sky:#e3f3ef; --sky-2:#f4f2eb; --line:#e5e1d5;
  --ink:#16302d; --muted:#667a76; --white:#fff;
  --ok:#0f8a4f; --ok-bg:#dcf5e6; --warn:#a15c00; --warn-bg:#fff0cf; --bad:#c2303a; --bad-bg:#fde6e7; --info:#0f766e; --info-bg:#dff1ee; --mute-bg:#eeece4;
  --accent:#f5a524; --toast:#0a3f3b;
  --grad:linear-gradient(135deg,#14907f 0%,#0f766e 45%,#0b5560 100%);
  --r:20px; --sh:0 1px 2px rgba(10,63,59,.05),0 10px 28px rgba(10,63,59,.08);
  --ring:rgba(15,118,110,.2);
}
@media screen and (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --blue:#13897f; --blue-d:#c4efe8; --blue-m:#2bb3a3; --sky:#1b2e2b; --sky-2:#0e1715; --line:#263633;
    --ink:#e5f1ee; --muted:#93aaa5; --white:#15201e;
    --ok:#4ade80; --ok-bg:#12301f; --warn:#fbbf24; --warn-bg:#35280b; --bad:#fb7185; --bad-bg:#3a1519; --info:#5eead4; --info-bg:#123430; --mute-bg:#1e2a28;
    --toast:#2a4a45;
    --grad:linear-gradient(135deg,#0f6f66 0%,#0b5a54 50%,#0a3f4a 100%);
    --sh:0 10px 30px rgba(0,0,0,.45);
    --ring:rgba(45,212,191,.25);
  }
  .btn.danger{color:#2a0a0e}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;color:var(--ink);background:var(--sky-2);font-size:16px;line-height:1.55}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.3}
h2{font-size:1.5rem;font-weight:800;color:var(--blue-d)}
h3{font-size:1.08rem;font-weight:800;color:var(--blue-d)}
a{color:var(--blue)}
.muted{color:var(--muted)} .center{text-align:center} .hidden{display:none!important}
small{color:var(--muted)}
code,.code{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;unicode-bidi:embed}

/* inputs */
input,select,textarea{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--white);outline:none;min-height:46px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--ring)}
input::placeholder{color:var(--muted);opacity:.8}
input[type=checkbox],input[type=radio]{width:20px;height:20px;min-height:0;accent-color:var(--blue);padding:0}
label{display:block;font-weight:700;font-size:.92rem;margin-bottom:12px}
label>input,label>select,label>textarea{margin-top:6px;font-weight:400}
label.inl{display:flex;align-items:center;gap:8px;font-weight:700}
label.inl>input{margin:0;width:20px}
input[type=date],input[type=time]{direction:ltr;text-align:right}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--white);color:var(--blue-d);padding:9px 18px;border-radius:14px;font-weight:700;cursor:pointer;min-height:46px;transition:background .15s,border-color .15s,transform .1s,box-shadow .15s;text-decoration:none}
.btn:hover{background:var(--sky)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 18px rgba(15,118,110,.28)}
.btn.primary:hover{filter:brightness(1.07);background:var(--grad)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger:hover{filter:brightness(.92);background:var(--bad)}
.btn.sm{min-height:38px;padding:5px 14px;font-size:.88rem;border-radius:12px}
.btn.block{width:100%}
.btn.link{border:none;background:none;text-decoration:underline;min-height:36px}
.btn.danger-t{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}

/* layout */
.row{display:flex;align-items:center}
.row.gap,.gap{gap:10px}
.row.wrap,.wrap{flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}

/* header */
.top{position:relative;overflow:hidden;background:var(--grad);color:#fff;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px 34px;padding-top:max(16px,env(safe-area-inset-top));border-radius:0 0 32px 32px}
.top::before,.top::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.top::before{width:230px;height:230px;top:-110px;left:-70px}
.top::after{width:150px;height:150px;bottom:-70px;right:28%;background:rgba(245,165,36,.16)}
.top>*{position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand>div{min-width:0;flex:1}
.brand b{display:block;font-size:1.05rem;font-weight:800;line-height:1.35}
.brand small{display:block;color:rgba(255,255,255,.78);font-size:.8rem}
.mark{width:48px;height:48px;flex:none;display:grid;place-items:center;background:#fff;border-radius:16px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.mark svg{width:32px;height:32px}
.top-r{display:flex;align-items:center;gap:8px;flex:none}
.top .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff;border-radius:999px}
.top .btn:hover{background:rgba(255,255,255,.28)}
.who{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:700;color:#fff;background:rgba(0,0,0,.16);padding:4px 12px 4px 6px;border-radius:999px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uav{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#3b2600;display:inline-grid;place-items:center;font-weight:800;font-size:.85rem;flex:none}
.sync{width:10px;height:10px;border-radius:50%;background:#5ee19a;box-shadow:0 0 0 4px rgba(94,225,154,.25);flex:none}
.sync.off{background:#ffb4b4;box-shadow:0 0 0 4px rgba(255,180,180,.25)}

/* navigation: شريط سفلي على الموبايل */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:2px;overflow-x:auto;background:var(--white);border-top:1px solid var(--line);box-shadow:0 -10px 28px rgba(10,63,59,.1);padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:1 0 auto;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.7rem;line-height:1.25;padding:7px 8px;border-radius:16px;white-space:nowrap;transition:background .15s,color .15s}
.tabs a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs a.on{background:var(--sky);color:var(--blue)}
@media(min-width:900px){
  .tabs{position:sticky;top:10px;bottom:auto;left:auto;right:auto;width:fit-content;max-width:calc(100% - 28px);margin:-20px auto 0;border:1px solid var(--line);border-radius:999px;box-shadow:var(--sh);padding:6px}
  .tabs a{flex-direction:row;gap:8px;font-size:.92rem;padding:8px 16px;border-radius:999px;min-width:0}
  .tabs a.on{background:var(--grad);color:#fff}
}
main{max-width:1100px;margin:0 auto;padding:20px 14px 120px}
.page-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.page-h .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.page-h input[type=date]{width:auto}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{position:relative;overflow:hidden;background:var(--white);border:1.5px solid transparent;border-radius:18px;padding:12px 14px;text-align:right;cursor:pointer;font-family:inherit;box-shadow:var(--sh);transition:transform .12s,box-shadow .15s}
.stat:active{transform:scale(.97)}
.stat::before{content:"";position:absolute;left:-14px;top:-14px;width:46px;height:46px;border-radius:50%;background:var(--sky)}
.stat b{position:relative;display:block;font-size:1.9rem;font-weight:800;line-height:1.15;color:var(--blue-d)}
.stat span{position:relative;font-size:.85rem;color:var(--muted);font-weight:700}
.stat.ok{background:var(--ok-bg)} .stat.ok::before{background:rgba(15,138,79,.16)}
.stat.warn{background:var(--warn-bg)} .stat.warn::before{background:rgba(161,92,0,.16)}
.stat.bad{background:var(--bad-bg)} .stat.bad::before{background:rgba(194,48,58,.16)}
.stat.ok b{color:var(--ok)} .stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)}
.stat.on{background:var(--grad);border-color:transparent;box-shadow:0 10px 22px rgba(15,118,110,.32)}
.stat.on::before{background:rgba(255,255,255,.18)}
.stat.on b,.stat.on span{color:#fff!important}
@media(min-width:760px){.stats{grid-template-columns:repeat(6,1fr)}}

.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.filters input[type=search]{grid-column:1/-1}
@media(min-width:760px){.filters{grid-template-columns:2fr 1fr 1fr 1fr 1fr}.filters input[type=search]{grid-column:auto}}

/* list rows */
.list{padding:6px 16px}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:none}
.item b{display:block;font-size:1rem;font-weight:700}
.item small{display:block}
.item .side{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.item .st-sel{width:auto;min-height:38px;padding:4px 8px;font-size:.9rem;border-radius:12px}
.av{width:48px;height:48px;border-radius:16px;object-fit:cover;flex:none;background:var(--sky);border:1px solid var(--line)}
.av.ph{display:grid;place-items:center;font-weight:800;color:var(--blue);font-size:1.2rem;background:linear-gradient(135deg,var(--sky),var(--info-bg))}
.empty{text-align:center;color:var(--muted);padding:38px 10px;font-weight:600}
.badge{display:inline-block;padding:3px 12px;border-radius:999px;font-weight:700;font-size:.82rem;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)} .badge.info{background:var(--info-bg);color:var(--info)} .badge.mute{background:var(--mute-bg);color:var(--muted)}
.tm{font-size:.82rem;color:var(--muted);direction:ltr}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(6,30,28,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{position:relative;background:var(--white);color:var(--ink);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:14px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.modal::before{content:"";display:block;width:42px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.modal.wide{max-width:900px}
.modal .x{position:absolute;left:14px;top:18px;width:36px;height:36px;border:none;background:var(--sky);border-radius:50%;font-size:1.4rem;cursor:pointer;color:var(--blue-d)}
.modal h3{margin-bottom:14px;padding-left:44px}
@media(min-width:640px){.modal-bg{align-items:center;padding:20px}.modal{border-radius:26px;padding-top:22px}.modal::before{display:none}.modal .x{top:16px}}
.confirm-msg{font-size:1.05rem;margin:6px 0 18px}
.form-grid{display:grid;grid-template-columns:1fr;gap:0 12px}
@media(min-width:560px){.form-grid{grid-template-columns:1fr 1fr}.form-grid .full{grid-column:1/-1}}
.photo-pick{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.photo-pick img,.photo-pick .av{width:78px;height:104px;border-radius:16px;object-fit:cover}

/* qr */
.qr-box{display:flex;justify-content:center;margin:6px 0 10px}
.qr-canvas{width:min(280px,70vw);height:auto;border:1px solid var(--line);border-radius:18px;background:#fff}
.code{display:block;text-align:center;color:var(--muted);margin-bottom:12px;font-size:.9rem}

/* scanner */
.scan-wrap{display:grid;gap:14px;max-width:560px;margin:0 auto}
.video-box{position:relative;background:#06231f;border-radius:26px;overflow:hidden;aspect-ratio:1/1;margin-bottom:12px;box-shadow:var(--sh)}
.video-box video{width:100%;height:100%;object-fit:cover;display:block}
.reticle{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.92);border-radius:24px;box-shadow:0 0 0 999px rgba(3,24,21,.45);pointer-events:none}
.reticle::before,.reticle::after{content:"";position:absolute;left:8%;right:8%;height:3px;border-radius:3px;background:var(--accent);top:50%;opacity:0}
.video-box.live .reticle::before{opacity:.95;animation:sweep 2s ease-in-out infinite}
@keyframes sweep{0%,100%{top:12%}50%{top:88%}}
@media(prefers-reduced-motion:reduce){.video-box.live .reticle::before{animation:none;top:50%}}
.vid-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;padding:20px;font-weight:700}
.result{border-radius:22px;padding:16px;display:flex;gap:14px;align-items:center;margin-top:12px;border:2px solid}
.result.ok{background:var(--ok-bg);border-color:var(--ok)} .result.warn{background:var(--warn-bg);border-color:var(--warn)}
.result.bad{background:var(--bad-bg);border-color:var(--bad)} .result.info{background:var(--info-bg);border-color:var(--info)}
.result h3{font-size:1.15rem;margin-bottom:2px}
.result .av{width:64px;height:84px}

/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--white);box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--sky);color:var(--blue-d);position:sticky;top:0;font-weight:800}
td input,td select{min-height:38px;padding:4px 8px;min-width:110px}
td.nm input{min-width:210px}
.mx td,.mx th{text-align:center;padding:6px 7px}
.mx td:first-child,.mx th:first-child{text-align:right;position:sticky;right:0;background:var(--white)}
.mx th:first-child{background:var(--sky)}
.sym{font-weight:800}
.sym.present{color:var(--ok)} .sym.late{color:var(--warn)} .sym.absent{color:var(--bad)} .sym.leave{color:var(--info)} .sym.none{color:var(--muted);opacity:.45}
tr.dupe td{background:var(--warn-bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--white);border-radius:999px;padding:6px 16px;font-weight:700;cursor:pointer;color:var(--blue-d);min-height:38px}
.chip.on{background:var(--grad);border-color:transparent;color:#fff}
.seg{display:flex;border:1.5px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px;background:var(--white);padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;padding:10px;font-weight:700;cursor:pointer;color:var(--muted);border-radius:12px}
.seg button.on{background:var(--grad);color:#fff}
.drop{border:2px dashed var(--blue-m);background:var(--sky);border-radius:var(--r);padding:30px 14px;text-align:center;cursor:pointer;font-weight:700;color:var(--blue-d)}
.drop.drag{background:var(--info-bg)}
.note{background:var(--info-bg);border-radius:14px;padding:11px 14px;font-size:.9rem;margin-bottom:12px;color:var(--blue-d)}
.err{color:var(--bad);min-height:1.4em;font-weight:600;margin-bottom:8px}
.cards2{display:grid;gap:12px}
@media(min-width:760px){.cards2{grid-template-columns:1fr 1fr}}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(5,1fr)}}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--sh)}
.kpi b{font-size:1.45rem;font-weight:800;display:block;color:var(--blue-d)}
.kpi span{font-size:.82rem;color:var(--muted);font-weight:700}
.pct{display:inline-block;min-width:46px;text-align:center;font-weight:800}

/* login */
.login{position:relative;overflow:hidden;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--grad)}
.login::before,.login::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.login::before{width:340px;height:340px;background:rgba(255,255,255,.08);top:-120px;left:-100px}
.login::after{width:260px;height:260px;background:rgba(245,165,36,.18);bottom:-90px;right:-60px}
.login-card{position:relative;z-index:1;width:100%;max-width:390px;padding:30px 24px 24px;border-radius:30px;border:none;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.login-card .logo{width:72px;height:72px;margin:-66px auto 14px;background:#fff;border-radius:22px;display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,0,0,.2);border:3px solid var(--accent)}
.login-card .logo svg{width:46px;height:46px}
.login-card h1{text-align:center;font-size:1.35rem;font-weight:800;color:var(--blue-d)}
.login-card p{text-align:center;margin:4px 0 18px}

/* toasts */
#toasts{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:90;display:grid;gap:8px;width:min(92vw,420px);pointer-events:none}
@media(min-width:900px){#toasts{bottom:24px}}
.toast{background:var(--toast);color:#fff;padding:12px 18px;border-radius:16px;font-weight:700;box-shadow:var(--sh);transition:opacity .4s}
.toast.bad{background:var(--bad);color:#fff} .toast.out{opacity:0}

/* print */
#printArea{display:none}
@media print{
  @page{size:A4;margin:8mm}
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block}
  body{background:#fff;font-size:12px}
  .sheet{display:grid;grid-template-columns:repeat(2,85.6mm);gap:4mm 6mm;justify-content:center;direction:rtl}
  .sheet img.pc{width:85.6mm;height:54mm;display:block;break-inside:avoid;border:.2mm solid #9db6e4;border-radius:2mm}
  .rep-print{direction:rtl;font-family:'Cairo',Tahoma,sans-serif}
  .rep-print h2{margin-bottom:2px} .rep-print .meta{color:#555;margin-bottom:10px}
  .rep-print table{font-size:11px} .rep-print th{position:static;background:#e8eefb!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rep-print .kpis{grid-template-columns:repeat(5,1fr)}
  .rep-print .tbl-wrap{border:none;overflow:visible}
  .rep-print .mx td:first-child,.rep-print .mx th:first-child{position:static}
  .sheet img.pc,.rep-print *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

</style>
</head>
<body>
<div id="app"><div id="boot" style="padding:40px 20px;text-align:center;font-family:sans-serif;color:#0f766e">جارٍ تحميل النظام… (نسخة 5)</div></div>
<div id="printArea"></div>
<div id="modalRoot"></div>
<div id="toasts"></div>
<script>

    if (ni < 0)
        ni = 0;
    rec.name = rest.splice(ni, 1)[0];
    if (rest.length && !rec.section)
        rec.section = rest.shift();
    if (rest.length && !rec.hall)
        rec.hall = rest.shift();

function detectHeader(rows) {
    for (let i = 0; i < Math.min(rows.length, 10); i++) {
        const map = {};
        rows[i].forEach((c, idx) => { for (const k of Object.keys(HDR))
            if (HDR[k].test(c) && !(k in map))
                map[k] = idx; });
        if ('name' in map && Object.keys(map).length >= 2)
            return { i, map, n: rows[i].length };
    }
    return null;
}
function rowsToRecords(rows) {
    rows = rows.map((r) => r.map(nrm).filter(Boolean)).filter((r) => r.length);
    // وضع الاستمارات: «الاسم: ... المرحلة: ...»
    const flat = rows.map((r) => r.join(' '));
    const labelled = flat.filter((l) => /(الاسم|اسم الطالب|المرحلة|القسم|القاعة)\s*[:：]/.test(l)).length;
    if (labelled >= 3) {
        const out = [];
        let cur = null;
        for (const line of flat) {
            LABEL_RE.lastIndex = 0;
            let m;
            while ((m = LABEL_RE.exec(line)) !== null) {
                const k = m[1], v = nrm(m[2]);
                if (/^(الاسم|اسم الطالب|اسم الطالبة|الاسم الكامل)$/.test(k)) {
                    cur = { name: v, stage: '', section: '', hall: '' };
                    out.push(cur);
                }
                else if (cur) {
                    if (/^(المرحلة|المرحله|الصف)$/.test(k))
                        cur.stage = v;
                    else if (/^(القسم|الفرع)$/.test(k))
                        cur.section = v;
                    else
                        cur.hall = v;
                }
            }
        }
        return out.filter((r) => r.name);
    }
    // وضع الجداول
    const hdr = detectHeader(rows);
    const wide = rows.filter((r) => r.length >= 3).length >= rows.length * 0.5;
    const out = [];
    rows.forEach((r, i) => {
        if (hdr && i <= hdr.i)
            return;
        if (wide && r.length < 2)
            return;
        if (r.some((c) => NOISE_RE.test(c)) && r.length < 3)
            return;
        let rec;
        if (hdr && r.length === hdr.n) {
            rec = { name: r[hdr.map.name] || '', stage: r[hdr.map.stage] || '', section: r[hdr.map.section] || '', hall: r[hdr.map.hall] || '' };
            for (const k of ['stage', 'section', 'hall'])
                rec[k] = stripLabel(rec[k], { stage: 'المرحلة|الصف', section: 'القسم|الفرع', hall: 'القاعة|الشعبة' }[k]);
        }
        else
            rec = rowToRec(r);

}
function groupLines(items, factor) {
    if (!items.length)
        return [];
    const hs = items.map((i) => i.h || 10).sort((a, b) => a - b);
    const H = hs[hs.length >> 1] || 10;
    const GAP = Math.max(6, H * factor);
    items.sort((a, b) => b.y - a.y);
    const lines = [];
    for (const it of items) {
        const tol = Math.max(2.5, (it.h || H) * 0.5);
        let L = lines.find((l) => Math.abs(l.y - it.y) <= tol);
        if (!L) {
            L = { y: it.y, items: [] };
            lines.push(L);
        }
        L.items.push(it);
    }
    lines.sort((a, b) => b.y - a.y);
    return lines.map((L) => {
        const its = L.items.sort((a, b) => (b.x + b.w) - (a.x + a.w));
        const cells = [];
        let cur = null, left = 0;
        for (const it of its) {
            if (cur && left - (it.x + it.w) <= GAP) {
                cur.s += ' ' + it.s;
                left = Math.min(left, it.x);
            }
            else {
                cur = { s: it.s };
                cells.push(cur);
                left = it.x;
            }
        }
        return cells.map((c) => c.s);
    });
}
async function ocrPage(page) {
    await lib('ocr');
    const vp = page.getViewport({ scale: 2.2 });
    const c = document.createElement('canvas');
    c.width = vp.width;
    c.height = vp.height;
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    const { data } = await Tesseract.recognize(c, 'ara');
    return data.text.split('\n').map((l) => l.trim()).filter(Boolean).map((l) => l.split(/\s{2,}|\t|\|/));
}

    root.innerHTML = `<section><div class="page-h"><h2>التقارير</h2><div class="acts"><button class="btn" id="rPrint">طباعة</button><button class="btn" id="rCsv">تصدير Excel (CSV)</button></div></div>

            [st.from, st.to] = [y, y];
        }

        if (!st.from || !st.to || st.from > st.to)

            const recs = new Map(a.records.map((r) => [r.student_id + '|' + r.date, r]));

    function compute() {
        const days = dateRange(st.from, st.to).filter(isSchoolDay);
        const studs = S.students.filter((s) => s.active && matchStudent(s, st)).sort(sortStudents);
        const rows = studs.map((s) => {

      ${matrix ? '<p class="muted" style="font-size:.85rem">✓ حاضر • ت متأخر • غ غائب • إ إجازة • – لم يُسجَّل بعد. أيام العطلة الأسبوعية غير محتسبة.</p>' : ''}` : '<div class="empty card">لا يوجد طلاب مطابقون</div>'}</div>`;
    }
    const csvRows = () => {
        const { days, rows } = compute();

        rows.forEach((r) => { var _a; return out.push([r.s.name, r.s.stage, r.s.section, r.s.hall, ...r.cells.map((c) => STATUS[c.e].t), r.c.present, r.c.late, r.c.absent, r.c.leave, (_a = r.pct) !== null && _a !== void 0 ? _a : '']); });
        return out;

        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));

        document.body.appendChild(a);
        a.click();
        a.remove();
    };
    $('#rPrint').onclick = () => { const b = $('#repBody'); if (!b)
        return; printHTML(`<div class="rep-print"><h2>${esc(S.settings.school_name)}</h2><div class="meta">${esc(b.dataset.title)} — طُبع في ${S.today}</div>${b.innerHTML}</div>`); };
    load();
    return { refresh: () => { if (!anyModal())

};
